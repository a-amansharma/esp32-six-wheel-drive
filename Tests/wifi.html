<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ESP32-6WD</title>
<style>
*{
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  background:
    radial-gradient(circle at 18% 10%,rgba(255,244,197,.70),transparent 28%),
    radial-gradient(circle at 86% 18%,rgba(189,229,255,.72),transparent 30%),
    radial-gradient(circle at 50% 88%,rgba(255,207,181,.52),transparent 34%),
    linear-gradient(145deg,#f7fbff,#d8e7ee 55%,#d7dde1);
  font-family:'SF Pro Display','Avenir Next','Segoe UI',Roboto,Arial,sans-serif;
  overscroll-behavior:contain;
}

.main{
  width:100vw;
  min-height:100dvh;
  padding:20px 14px 18px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin:0;
  font-size:35px;
  font-weight:950;
  letter-spacing:.8px;
  color:#1f2b3d;
  font-family:'Avenir Next','SF Pro Display','Segoe UI',Arial,sans-serif;
  text-shadow:0 1px 0 #fff,0 5px 13px rgba(52,72,86,.22);
}
h3{
  margin:6px 0 0;
  font-size:16px;
  font-weight:800;
  color:#4f5868;
  letter-spacing:0.5px;
  text-shadow:0 1px 0 #fff;
}

/* ───────── PREMIUM WHITE MEDIA BUTTON STYLE ───────── */
.roundBtn,.smallBtn,.btn,.modeBtn{
  border:none;
  outline:none;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  color:#5d6678;
  background:
    radial-gradient(circle at 30% 22%,#ffffff 0 23%,#f7fafb 42%,#e4e9eb 72%,#cfd8dc 100%);
  box-shadow:
    12px 14px 22px rgba(48,58,64,.30),
    -8px -8px 18px rgba(255,255,255,.85),
    inset 2px 2px 4px rgba(255,255,255,.95),
    inset -4px -5px 8px rgba(90,105,112,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .18s ease,color .18s ease;
}
.roundBtn::before,.smallBtn::before,.btn::before,.modeBtn::before{
  content:"";
  position:absolute;
  left:17%;
  top:9%;
  width:58%;
  height:34%;
  border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.12));
  transform:rotate(-18deg);
  pointer-events:none;
}
.roundBtn::after,.smallBtn::after,.btn::after,.modeBtn::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:inherit;
  border:1px solid rgba(255,255,255,.82);
  pointer-events:none;
}
.roundBtn:active,.smallBtn:active,.btn:active,.btn.active,.modeBtn:active,.modeBtn.active{
  transform:translateY(7px) scale(.95);
  filter:saturate(1.15) brightness(1.03);
  box-shadow:
    4px 5px 10px rgba(48,58,64,.26),
    -3px -3px 9px rgba(255,255,255,.7),
    inset 7px 8px 16px rgba(70,85,94,.23),
    inset -5px -5px 12px rgba(255,255,255,.78);
}

/* ── TOP 4 BUTTONS ROW ── */
.topRow{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:410px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:0 12px;
  pointer-events:none;
  z-index:10;
}
.topRow .cornerGroup{pointer-events:auto;}
.cornerGroup{display:flex;flex-direction:column;align-items:center;gap:10px;}
.cornerGroup.right{align-items:center;}

.roundBtn{
  width:66px;
  height:66px;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}
.roundBtn svg{width:29px;height:29px;z-index:2;position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
#hornBtn svg{color:#f5a623;}
#lightBtn svg{color:#36a8ff;}
.roundBtn span{
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
  z-index:2;
  position:relative;
  text-transform:uppercase;
}
.roundBtn .ledGlow{
  position:absolute;
  inset:0;
  border-radius:50%;
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
}

/* Active horn/light: same premium button, with yellow pressed glow */
.roundBtn.active-horn,.roundBtn.active-light{
  color:#5b4700;
  background:radial-gradient(circle at 30% 22%,#fffdf4 0 18%,#fff2a8 42%,#ffc23a 72%,#e99a00 100%);
  box-shadow:
    0 0 0 3px rgba(255,197,40,.34),
    0 0 24px rgba(255,184,0,.70),
    4px 5px 10px rgba(48,58,64,.22),
    inset 7px 8px 15px rgba(92,68,0,.18),
    inset -5px -5px 12px rgba(255,255,255,.55);
  transform:translateY(5px) scale(.96);
}
.roundBtn.active-horn .ledGlow,.roundBtn.active-light .ledGlow{
  background:radial-gradient(circle at 50% 55%,rgba(255,210,40,.52),transparent 66%);
  opacity:1;
}

.smallBtn{
  width:52px;
  height:29px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:8px;
  font-weight:900;
  letter-spacing:.6px;
  text-transform:uppercase;
}
.smallBtn svg{width:12px;height:12px;z-index:2;position:relative;}
#hornPulseBtn svg{color:#ff9f1c;}
#lightPulseBtn svg{color:#13b8ff;}

/* Pulse button: ONLY this small pulse button blinks yellow */
.smallBtn.active-pulse-horn,.smallBtn.active-pulse-light{
  color:#5b4700;
  background:radial-gradient(circle at 30% 22%,#fffdf4 0 18%,#fff2a8 42%,#ffc23a 72%,#e99a00 100%);
  box-shadow:
    0 0 0 2px rgba(255,197,40,.36),
    0 0 16px rgba(255,184,0,.70),
    2px 3px 8px rgba(48,58,64,.22),
    inset 5px 5px 11px rgba(92,68,0,.18),
    inset -4px -4px 9px rgba(255,255,255,.55);
}
@keyframes pulseYellowBlink{
  0%,100%{
    opacity:1;
    filter:brightness(1);
  }
  50%{
    opacity:.46;
    filter:brightness(1.18);
  }
}
.smallBtn.blinking{animation:pulseYellowBlink .333s infinite;}

/* ── TRIM: previous compact 3D style ── */
.trimBox{
  margin-top:14px;
  width:210px;
  height:34px;
  padding:6px 14px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#e1e7ea);
  box-shadow:
    8px 9px 17px rgba(48,58,64,.23),
    -6px -6px 14px rgba(255,255,255,.9),
    inset 2px 2px 5px rgba(255,255,255,.9),
    inset -3px -3px 7px rgba(70,84,92,.10);
  display:flex;
  align-items:center;
  justify-content:center;
}
#trimSlider{
  width:174px;
  height:6px;
  appearance:none;
  border-radius:20px;
  background:linear-gradient(90deg,#d5dce0 0%,#d5dce0 50%,#4f5868 50%,#4f5868 50%,#d5dce0 50%,#d5dce0 100%);
  box-shadow:inset 2px 2px 5px rgba(0,0,0,.20),inset -2px -2px 5px rgba(255,255,255,.95);
}
#trimSlider::-webkit-slider-thumb{
  appearance:none;
  width:24px;
  height:24px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff,#eef3f5 35%,#8b98a3 76%,#56616b);
  box-shadow:0 6px 10px rgba(0,0,0,.30),inset 3px 3px 6px rgba(255,255,255,.70),inset -3px -3px 6px rgba(0,0,0,.22);
}
#trimSlider::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;border:none;
  background:radial-gradient(circle at 30% 25%,#fff,#eef3f5 35%,#8b98a3 76%,#56616b);
  box-shadow:0 6px 10px rgba(0,0,0,.30),inset 3px 3px 6px rgba(255,255,255,.70),inset -3px -3px 6px rgba(0,0,0,.22);
}

/* ── MODE SWITCH SLIDING CAPSULE UI ── */
.modeSwitch{
  margin-top:12px;
  width:260px;
  height:60px;
  padding:7px;
  border-radius:34px;
  display:flex;
  gap:8px;
  position:relative;
  background:
    radial-gradient(circle at 25% 18%,rgba(255,255,255,.95),transparent 45%),
    linear-gradient(145deg,#fff9e7,#dceeff 55%,#e8e3ff);
  box-shadow:
    10px 11px 20px rgba(48,58,64,.24),
    -7px -7px 16px rgba(255,255,255,.88),
    inset 4px 4px 10px rgba(255,255,255,.82),
    inset -5px -5px 12px rgba(70,84,92,.12);
}
.modeSwitch::before{
  content:"";
  position:absolute;
  width:calc(50% - 10px);
  height:44px;
  left:7px;
  top:7px;
  border-radius:28px;
  background:
    radial-gradient(circle at 28% 20%,#ffffff 0 18%,#eaf7ff 42%,#9ed9ff 74%,#55aeea 100%);
  box-shadow:
    6px 7px 13px rgba(55,76,90,.26),
    -4px -4px 9px rgba(255,255,255,.70),
    inset 3px 3px 6px rgba(255,255,255,.92),
    inset -5px -5px 10px rgba(47,105,139,.18),
    0 0 18px rgba(98,185,255,.38);
  transition:transform .38s cubic-bezier(.2,.9,.22,1);
  z-index:0;
}
.modeSwitch.joySelected::before{transform:translateX(calc(100% + 6px));}
.modeBtn{
  flex:1;
  border-radius:26px;
  height:44px;
  font-size:11px;
  font-weight:950;
  letter-spacing:.7px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:transparent;
  box-shadow:none;
  color:#697489;
  z-index:1;
}
.modeBtn::before,.modeBtn::after{display:none;}
.modeBtn:active,.modeBtn.active{
  transform:none;
  box-shadow:none;
  filter:none;
  color:#203047;
}
.modeBtn svg{width:18px;height:18px;z-index:2;position:relative;transition:color .25s ease;}
.modeBtn span{z-index:2;position:relative;}
#buttonModeBtn svg{color:#ff9f1c;}
#joyModeBtn svg{color:#22a7f0;}

/* ── MODE STAGE: no swipe, switch button controls it ── */
.modeStage{
  margin-top:22px;
  position:relative;
  isolation:isolate;
  touch-action:none;
}
.modeTrack{
  width:200%;
  display:flex;
  transition:transform .38s cubic-bezier(.2,.9,.25,1);
}
.modeStage.joystickMode .modeTrack{transform:translateX(-50%);}
.modePanel{
  width:50%;
  flex:0 0 50%;
  display:flex;
  justify-content:center;
  align-items:center;
}


/* ── DRIVE CONTROLS: circular base + horn/light style buttons ── */
.controls{position:relative;width:315px;height:315px;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.97),rgba(241,246,248,.90) 30%,rgba(199,211,216,.50) 62%,rgba(88,100,106,.18) 100%),linear-gradient(145deg,#ffffff,#d4dde1);
  box-shadow:18px 20px 35px rgba(48,58,64,.32),-12px -12px 28px rgba(255,255,255,.86),inset 8px 8px 18px rgba(255,255,255,.83),inset -12px -12px 25px rgba(70,84,92,.14);}
.controls::before{content:"";position:absolute;width:244px;height:244px;left:35px;top:35px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(245,248,249,.70),rgba(159,174,183,.22) 62%,rgba(0,0,0,.10)),linear-gradient(145deg,#e8eef1,#ffffff);
  box-shadow:inset 11px 12px 22px rgba(62,77,86,.15),inset -11px -11px 22px rgba(255,255,255,.94);}

.btn{position:absolute;width:76px;height:76px;border:none;outline:none;border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:4;cursor:pointer;overflow:hidden;color:#5d6678;
  background:radial-gradient(circle at 30% 22%,#ffffff 0 23%,#f7fafb 42%,#e4e9eb 72%,#cfd8dc 100%);
  box-shadow:12px 14px 22px rgba(48,58,64,.30),-8px -8px 18px rgba(255,255,255,.85),inset 2px 2px 4px rgba(255,255,255,.95),inset -4px -5px 8px rgba(90,105,112,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .18s ease,color .18s ease,filter .12s ease;}
.btn::before{content:"";position:absolute;left:17%;top:9%;width:58%;height:34%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.12));transform:rotate(-18deg);pointer-events:none;}
.btn::after{content:"";position:absolute;inset:1px;border-radius:inherit;border:1px solid rgba(255,255,255,.82);pointer-events:none;}
.btn:active,.btn.active{transform:translateY(7px) scale(.95);filter:saturate(1.16) brightness(1.04);color:#fff;
  background:radial-gradient(circle at 48% 62%,#d8fbff 0 10%,#5ee1ff 27%,#159aff 57%,#0047b2 100%);
  box-shadow:inset 9px 10px 17px rgba(0,0,0,.42),inset -7px -7px 14px rgba(255,255,255,.44),0 5px 8px rgba(48,58,64,.25),0 0 0 5px rgba(88,178,255,.18),0 0 34px rgba(47,153,255,.78);}
.forward{left:119px;top:16px}.left{left:18px;top:120px}.right{right:18px;top:120px}.back{left:119px;top:223px}

.arrow{width:0;height:0;z-index:2;filter:drop-shadow(0 2px 1px rgba(255,255,255,.70)) drop-shadow(0 4px 4px rgba(0,0,0,.18));}
.up{border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #5d6678;}
.down{border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid #5d6678;}
.leftA{border-top:18px solid transparent;border-bottom:18px solid transparent;border-right:30px solid #5d6678;}
.rightA{border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:30px solid #5d6678;}
.btn:active .up,.btn.active .up{border-bottom-color:#fff}.btn:active .down,.btn.active .down{border-top-color:#fff}.btn:active .leftA,.btn.active .leftA{border-right-color:#fff}.btn:active .rightA,.btn.active .rightA{border-left-color:#fff}
.btn:active .arrow,.btn.active .arrow{filter:drop-shadow(0 0 7px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(74,213,255,.70)) drop-shadow(0 3px 4px rgba(0,0,0,.26));}
#forwardBtn.active,#backBtn.active{box-shadow:inset 9px 10px 17px rgba(0,0,0,.42),inset -7px -7px 14px rgba(255,255,255,.44),0 5px 8px rgba(48,58,64,.25),0 0 0 5px rgba(83,198,255,.23),0 0 26px rgba(0,195,255,.70),0 0 46px rgba(0,120,255,.38);}

.stop{width:104px;height:104px;left:105px;top:105px;font-size:0;}
.stop::before{content:"";position:relative;width:34px;height:34px;left:auto;top:auto;border-radius:5px;background:#ff7380;transform:none;box-shadow:0 0 12px rgba(255,115,128,.58),0 2px 4px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.72);z-index:2;}
.stop:active,.stop.active{background:radial-gradient(circle at 48% 62%,#fff0f2 0 10%,#ff9ca5 30%,#ff5463 60%,#b90016 100%);box-shadow:inset 9px 10px 17px rgba(0,0,0,.34),inset -7px -7px 14px rgba(255,255,255,.38),0 5px 8px rgba(48,58,64,.25),0 0 0 5px rgba(255,99,115,.18),0 0 30px rgba(255,68,85,.60);}
.stop:active::before{background:#ff4050;box-shadow:0 0 18px rgba(255,64,80,.92),0 2px 4px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.72);}

/* ── JOYSTICK ── */
.joyWrap{
  width:315px;
  height:315px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.97),rgba(241,246,248,.90) 30%,rgba(199,211,216,.50) 62%,rgba(88,100,106,.18) 100%),
    linear-gradient(145deg,#ffffff,#d4dde1);
  box-shadow:
    18px 20px 35px rgba(48,58,64,.34),
    -12px -12px 28px rgba(255,255,255,.86),
    inset 8px 8px 18px rgba(255,255,255,.83),
    inset -12px -12px 25px rgba(70,84,92,.15);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  touch-action:none;
}
.joyWrap::before{
  content:"";
  position:absolute;
  width:246px;
  height:246px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,rgba(245,248,249,.68),rgba(159,174,183,.22) 62%,rgba(0,0,0,.10)),
    linear-gradient(145deg,#e8eef1,#ffffff);
  box-shadow:
    inset 12px 13px 24px rgba(62,77,86,.16),
    inset -12px -12px 24px rgba(255,255,255,.94);
}
.joyBase{
  width:230px;
  height:230px;
  border-radius:50%;
  position:relative;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.15),transparent 33%),
    radial-gradient(circle at center,transparent 0 58%,rgba(95,110,121,.16) 59%,transparent 64%);
  z-index:2;
}
.joyBase::before,.joyBase::after{
  content:"";
  position:absolute;
  background:rgba(93,102,120,.22);
  border-radius:20px;
  box-shadow:0 1px 0 rgba(255,255,255,.75);
}
.joyBase::before{width:162px;height:5px;left:34px;top:112px;}
.joyBase::after{width:5px;height:162px;left:112px;top:34px;}

.knob{
  width:108px;
  height:108px;
  border-radius:50%;
  position:absolute;
  left:61px;
  top:61px;
  background:
    radial-gradient(circle at 30% 22%,#ffffff 0 13%,#bcecff 23%,#329cff 50%,#075fd4 78%,#02275e 100%);
  box-shadow:
    15px 17px 24px rgba(48,58,64,.36),
    -7px -7px 14px rgba(255,255,255,.62),
    inset 8px 8px 14px rgba(255,255,255,.52),
    inset -10px -12px 18px rgba(0,0,0,.40),
    0 0 24px rgba(46,155,255,.30);
  z-index:5;
  transition:box-shadow .12s;
}
.knob::before{
  content:"";
  position:absolute;
  width:62px;
  height:32px;
  border-radius:50%;
  left:18px;
  top:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.10));
  filter:blur(.5px);
  transform:rotate(-18deg);
}
.knob.active{
  box-shadow:
    20px 23px 30px rgba(48,58,64,.39),
    -6px -6px 13px rgba(255,255,255,.65),
    inset 4px 4px 8px rgba(255,255,255,.95),
    inset -8px -9px 16px rgba(90,105,112,.18),
    0 0 36px rgba(46,155,255,.80);
}
.joyText{
  position:absolute;
  bottom:16px;
  width:210px;
  height:58px;
  z-index:6;
  pointer-events:none;
}
.joyText svg{width:100%;height:100%;overflow:visible;}
.joyText text{
  font-size:9px;
  font-weight:900;
  letter-spacing:1.3px;
  fill:#4f5868;
  opacity:.78;
  text-shadow:0 1px 0 #fff;
}

/* ── SPEED BOX: previous clean style ── */
.speedBox{
  margin-top:20px;
  width:325px;
  min-height:108px;
  padding:16px 18px 14px;
  border-radius:34px;
  background:linear-gradient(145deg,#ffffff,#e2e9ec);
  box-shadow:
    10px 11px 22px rgba(48,58,64,.26),
    -8px -8px 20px rgba(255,255,255,.90),
    inset 3px 3px 8px rgba(255,255,255,.88),
    inset -4px -4px 10px rgba(70,84,92,.10);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.speedBox label{
  font-size:20px;
  font-weight:500;
  margin-bottom:12px;
  padding:4px 18px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#dfe7ea);
  box-shadow:5px 5px 10px rgba(48,58,64,.18),-5px -5px 10px rgba(255,255,255,.85);
  color:#111;
  text-shadow:0 1px 0 #fff,0 3px 5px rgba(0,0,0,.22);
}
.speedRow{display:flex;align-items:center;gap:13px;}
input[type=range]{
  width:220px;
  height:10px;
  appearance:none;
  border-radius:20px;
  background:linear-gradient(90deg,#5d6678 59%,#d8e0e4 59%);
  box-shadow:inset 3px 3px 7px rgba(0,0,0,.2),inset -3px -3px 7px rgba(255,255,255,.95);
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:39px;
  height:39px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff,#eef4f6 34%,#aebbc2 72%,#5d6678);
  box-shadow:0 8px 16px rgba(0,0,0,.28),inset 4px 4px 8px rgba(255,255,255,.70),inset -4px -4px 8px rgba(0,0,0,.20);
}
input[type=range]::-moz-range-thumb{
  width:39px;height:39px;border-radius:50%;border:none;
  background:radial-gradient(circle at 30% 25%,#fff,#eef4f6 34%,#aebbc2 72%,#5d6678);
  box-shadow:0 8px 16px rgba(0,0,0,.28),inset 4px 4px 8px rgba(255,255,255,.70),inset -4px -4px 8px rgba(0,0,0,.20);
}
#speedVal{
  font-size:17px;
  font-weight:900;
  width:45px;
  text-align:left;
  color:#111;
  text-shadow:0 1px 0 #fff,0 2px 4px rgba(0,0,0,.32);
}

/* ── LANDSCAPE ── */
@media (orientation:landscape){
  .main{
    min-height:100dvh;
    height:auto;
    padding:10px 18px 12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto auto 1fr auto;
    column-gap:24px;
    row-gap:4px;
    align-items:center;
    justify-items:center;
  }
  h1{grid-column:1/-1;font-size:28px;line-height:1;}
  h3{grid-column:1/-1;font-size:13px;margin:0;}
  .trimBox{grid-column:1;grid-row:3;margin-top:2px;}
  .modeSwitch{display:none;}
  .topRow{
    position:absolute;
    top:58px;
    left:50%;
    grid-column:auto;
    grid-row:auto;
    margin-top:0;
    max-width:560px;
    transform:translateX(-50%) scale(.82);
  }
  .modeStage{
    grid-column:1/-1;
    grid-row:4;
    margin-top:2px;
    width:min(720px,96vw);
    overflow:visible;
    transform:none;
  }
  .modeTrack{
    width:100%;
    gap:26px;
    justify-content:center;
    transform:none !important;
  }
  .modePanel{
    width:auto;
    flex:0 0 auto;
  }
  .speedBox{
    grid-column:1/-1;
    grid-row:5;
    margin-top:0;
    width:380px;
    min-height:82px;
    transform:scale(.88);
  }
  #speedSlider{width:340px;}
  #modeTitle::after{content:" + Joystick";}
}

@media (orientation:landscape) and (max-height:430px){
  h1{font-size:22px;}
  h3{font-size:11px;}
  .trimBox{transform:scale(.78);margin-top:-4px;}
  .topRow{top:40px;transform:translateX(-50%) scale(.62);}
  .modeStage{width:min(650px,96vw);transform:scale(.70);transform-origin:center;}
  .modeTrack{gap:18px;}
  .speedBox{transform:scale(.70);margin-top:-22px;}
}

/* Laptop/Desktop landscape: large controllers */
@media (min-width:900px) and (orientation:landscape){
  .main{
    padding:22px 34px 26px;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto auto 1fr auto;
    column-gap:48px;
    row-gap:12px;
  }
  h1{font-size:44px;}
  h3{font-size:18px;}
  .trimBox{width:300px;height:48px;transform:none;}
  #trimSlider{width:270px;height:30px;}
  .topRow{
    top:102px;
    max-width:780px;
    transform:translateX(-50%) scale(1.05);
  }
  .modeStage{
    width:min(860px,92vw);
    transform:scale(1.06);
    transform-origin:center;
    margin-top:36px;
  }
  .modeTrack{gap:70px;}
  .speedBox{
    width:540px;
    min-height:118px;
    transform:none;
    margin-top:24px;
  }
  .speedBox label{font-size:22px;}
  #speedSlider{width:500px;height:40px;}
  #speedSlider::-webkit-slider-thumb{width:64px;height:64px;}
  #speedVal{font-size:30px;left:54px;}
}

@media (min-width:1200px) and (orientation:landscape){
  .modeStage{transform:scale(1.18);margin-top:58px;}
  .speedBox{margin-top:54px;}
  .topRow{transform:translateX(-50%) scale(1.15);}
}
</style>
</head>
<body>
<div class="main">
  <h1>ESP32-6WD</h1>
  <h3 id="modeTitle">Button Control</h3>

  <!-- TRIM: directly below title/subtitle -->
  <div class="trimBox">
    <input id="trimSlider" type="range" min="-25" max="25" value="0" oninput="setTrim(this.value)">
  </div>

  <!-- MODE SWITCH: no swipe needed -->
  <div id="modeSwitch" class="modeSwitch">
    <button id="buttonModeBtn" class="modeBtn active" onclick="setPanel(0)">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="7" cy="7" r="3"></circle><circle cx="17" cy="7" r="3"></circle>
        <circle cx="7" cy="17" r="3"></circle><circle cx="17" cy="17" r="3"></circle>
      </svg>
      <span>Buttons</span>
    </button>
    <button id="joyModeBtn" class="modeBtn" onclick="setPanel(1)">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="9" r="5"></circle>
        <rect x="6" y="15" width="12" height="5" rx="2"></rect>
      </svg>
      <span>Joystick</span>
    </button>
  </div>

  <!-- TOP 4 BUTTONS -->
  <div class="topRow">

    <!-- LEFT: Horn + Horn Pulse -->
    <div class="cornerGroup left">
      <button class="roundBtn" id="hornBtn" onclick="toggleHorn()">
        <div class="ledGlow"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" opacity="0.9"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <span>Horn</span>
      </button>
      <button class="smallBtn" id="hornPulseBtn" onclick="toggleHornPulse()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M2 12h2M6 8v8M10 5v14M14 8v8M18 6v12M22 12h-2"/>
        </svg>
        Pulse
      </button>
    </div>

    <!-- RIGHT: Headlight + Light Pulse -->
    <div class="cornerGroup right">
      <button class="roundBtn" id="lightBtn" onclick="toggleLight()">
        <div class="ledGlow"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" fill="currentColor" opacity="0.9" stroke="none"/>
          <line x1="12" y1="2" x2="12" y2="5"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
          <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="5" y2="12"/>
          <line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
          <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </svg>
        <span>Light</span>
      </button>
      <button class="smallBtn" id="lightPulseBtn" onclick="toggleLightPulse()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M9 2L7 8H3l3.5 3-1.5 5L9 13l4 3-1.5-5L15 8h-4z" fill="currentColor" stroke="none" opacity="0.88"/>
          <path d="M17 7l1-3M19 10l3-1M17 13l2 2"/>
        </svg>
        Pulse
      </button>
    </div>
  </div>

  <!-- DRIVE / JOY STAGE -->
  <div id="modeStage" class="modeStage buttonMode">
    <div id="modeTrack" class="modeTrack">
      <div class="modePanel">
        <div class="controls">
          <button id="forwardBtn" class="btn forward" onclick="toggleDrive('F')"><div class="arrow up"></div></button>
          <button class="btn left" onpointerdown="steer('L')" onpointerup="steer('N')" onpointercancel="steer('N')" onpointerleave="steer('N')"><div class="arrow leftA"></div></button>
          <button class="btn stop" onclick="stopCar()">STOP</button>
          <button class="btn right" onpointerdown="steer('R')" onpointerup="steer('N')" onpointercancel="steer('N')" onpointerleave="steer('N')"><div class="arrow rightA"></div></button>
          <button id="backBtn" class="btn back" onclick="toggleDrive('B')"><div class="arrow down"></div></button>
        </div>
      </div>
      <div class="modePanel">
        <div id="joyWrap" class="joyWrap">
          <div id="joyBase" class="joyBase"><div id="knob" class="knob"></div></div>
          <div class="joyText">
            <svg viewBox="0 0 210 58">
              <path id="uTextPath" d="M 20 0 Q 105 65 199 0" fill="none"/>
              <text><textPath href="#uTextPath" startOffset="50%" text-anchor="middle">360° SMOOTH DRIVE</textPath></text>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SPEED -->
  <div class="speedBox">
    <label>Speed</label>
    <div class="speedRow">
      <input id="speedSlider" type="range" min="0" max="255" value="150" oninput="setSpeed(this.value)">
      <div id="speedVal">59%</div>
    </div>
  </div>
</div>

<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

const modeStage=document.getElementById('modeStage');
const modeTitle=document.getElementById('modeTitle');
const joyBase=document.getElementById('joyBase');
const knob=document.getElementById('knob');

let currentPanel=0;
let driveMode='S',active=false,joyX=0,joyY=0,lastSend=0;
const maxMove=62;

// Horn & Light state
let hornOn=false,hornPulseOn=false,lightOn=false,lightPulseOn=false;

// ── MODE SWITCH ──
function setPanel(panel){
  currentPanel=panel;
  const btnMode=document.getElementById('buttonModeBtn');
  const joyMode=document.getElementById('joyModeBtn');
  const modeSwitch=document.getElementById('modeSwitch');

  if(panel===1){
    modeStage.classList.remove('buttonMode');
    modeStage.classList.add('joystickMode');
    modeSwitch.classList.add('joySelected');
    modeTitle.innerHTML='Joystick Control';
    btnMode.classList.remove('active');
    joyMode.classList.add('active');
    stopCar();
  }else{
    modeStage.classList.remove('joystickMode');
    modeStage.classList.add('buttonMode');
    modeSwitch.classList.remove('joySelected');
    modeTitle.innerHTML='Button Control';
    joyMode.classList.remove('active');
    btnMode.classList.add('active');
    releaseJoy();
  }
}

let modeSwipeStartX=0,modeSwipeStartY=0;
const modeSwitchEl=document.getElementById('modeSwitch');
modeSwitchEl.addEventListener('pointerdown',e=>{
  modeSwipeStartX=e.clientX;
  modeSwipeStartY=e.clientY;
});
modeSwitchEl.addEventListener('pointerup',e=>{
  const dx=e.clientX-modeSwipeStartX;
  const dy=e.clientY-modeSwipeStartY;
  if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.2){
    setPanel(dx<0?1:0);
  }
});

// ── DRIVE ──
function send(c){fetch('/cmd?move='+c).catch(()=>{});}
function updateButtons(){
  document.getElementById('forwardBtn').classList.toggle('active',driveMode==='F');
  document.getElementById('backBtn').classList.toggle('active',driveMode==='B');
}
function toggleDrive(m){
  if(driveMode===m){driveMode='S';send('S');}
  else{driveMode=m;send(m);}
  updateButtons();
}
function steer(m){
  send(m);
  const leftBtn=document.querySelector('.btn.left');
  const rightBtn=document.querySelector('.btn.right');
  leftBtn.classList.toggle('active',m==='L');
  rightBtn.classList.toggle('active',m==='R');
}
function stopCar(){driveMode='S';send('S');updateButtons();}

// ── JOYSTICK ──
function sendJoy(x,y,force=false){
  const now=Date.now();
  if(!force&&now-lastSend<45)return;
  lastSend=now;
  fetch('/joy?x='+Math.round(x)+'&y='+Math.round(y)).catch(()=>{});
}
function moveKnob(clientX,clientY){
  const rect=joyBase.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  let dx=clientX-cx,dy=clientY-cy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>maxMove){dx=dx/dist*maxMove;dy=dy/dist*maxMove;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  knob.classList.add('active');
  joyX=(dx/maxMove)*100;
  joyY=(-dy/maxMove)*100;
  sendJoy(joyX,joyY);
}
joyBase.addEventListener('pointerdown',e=>{
  active=true;
  joyBase.setPointerCapture(e.pointerId);
  moveKnob(e.clientX,e.clientY);
});
joyBase.addEventListener('pointermove',e=>{
  if(!active)return;
  moveKnob(e.clientX,e.clientY);
});
function releaseJoy(){
  active=false;
  joyX=0;
  joyY=0;
  knob.style.transform='translate(0px,0px)';
  knob.classList.remove('active');
  sendJoy(0,0,true);
}
joyBase.addEventListener('pointerup',releaseJoy);
joyBase.addEventListener('pointercancel',releaseJoy);
joyBase.addEventListener('lostpointercapture',releaseJoy);

// ── HORN ──
function toggleHorn(){
  hornOn=!hornOn;
  if(hornOn){
    hornPulseOn=false;
    setHornPulseUI(false);
  }
  setHornUI(hornOn);
  fetch('/horn?state='+(hornOn?'on':'off')).catch(()=>{});
}
function toggleHornPulse(){
  hornPulseOn=!hornPulseOn;
  if(hornPulseOn){
    hornOn=false;
    setHornUI(false);
  }
  setHornPulseUI(hornPulseOn);
  fetch('/hornpulse?state='+(hornPulseOn?'on':'off')).catch(()=>{});
}
function setHornUI(on){
  const b=document.getElementById('hornBtn');
  b.classList.toggle('active-horn',on);
}
function setHornPulseUI(on){
  const b=document.getElementById('hornPulseBtn');
  b.classList.toggle('active-pulse-horn',on);
  b.classList.toggle('blinking',on);
  // Important: only pulse button blinks, big horn button stays normal
  document.getElementById('hornBtn').classList.remove('blinking','active-pulse-horn');
}

// ── LIGHT ──
function toggleLight(){
  lightOn=!lightOn;
  if(lightOn){
    lightPulseOn=false;
    setLightPulseUI(false);
  }
  setLightUI(lightOn);
  fetch('/headlight').catch(()=>{});
}
function toggleLightPulse(){
  lightPulseOn=!lightPulseOn;
  if(lightPulseOn){
    lightOn=false;
    setLightUI(false);
  }
  setLightPulseUI(lightPulseOn);
  fetch('/lightpulse').catch(()=>{});
}
function setLightUI(on){
  const b=document.getElementById('lightBtn');
  b.classList.toggle('active-light',on);
  b.classList.remove('blinking','active-pulse-light');
}
function setLightPulseUI(on){
  const b=document.getElementById('lightPulseBtn');
  b.classList.toggle('active-pulse-light',on);
  b.classList.toggle('blinking',on);
  // Important: only pulse button blinks, big light button stays normal
  document.getElementById('lightBtn').classList.remove('blinking','active-pulse-light');
}

// ── TRIM & SPEED ──
function setTrim(v){
  let val=Number(v),pct=((val+25)/50)*100;
  const sl=document.getElementById('trimSlider');
  if(val>=0) sl.style.background='linear-gradient(90deg,#d5dce0 0%,#d5dce0 50%,#4f5868 50%,#4f5868 '+pct+'%,#d5dce0 '+pct+'%,#d5dce0 100%)';
  else sl.style.background='linear-gradient(90deg,#d5dce0 0%,#d5dce0 '+pct+'%,#4f5868 '+pct+'%,#4f5868 50%,#d5dce0 50%,#d5dce0 100%)';
  fetch('/trim?value='+val).catch(()=>{});
}
function getSpeedColor(p){
  return 'hsl('+(215-p*.35)+',16%,'+(50-p*.10)+'%)';
}
function setSpeed(v){
  let pct=Math.round((v/255)*100),color=getSpeedColor(pct);
  document.getElementById('speedVal').innerHTML=pct+'%';
  document.getElementById('speedSlider').style.background='linear-gradient(90deg,'+color+' 0%,'+color+' '+pct+'%,#d8e0e4 '+pct+'%,#d8e0e4 100%)';
  fetch('/speed?value='+v).catch(()=>{});
}

setTrim(0);
setSpeed(150);
updateButtons();
setPanel(0);
</script>
</body>
</html>
