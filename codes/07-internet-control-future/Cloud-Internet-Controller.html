<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ESP32-6WD V7 Internet Cloud Control</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding-bottom: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
      color: #101014;
      background: radial-gradient(circle at 50% -20%, #fff 0%, #f3f6fc 45%, #dde7f5 100%);
      overflow-x: hidden;
      overscroll-behavior: contain
    }

    .app {
      width: 100%;
      min-height: 100dvh;
      padding: 12px 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: .95;
      font-weight: 1000;
      letter-spacing: -1px;
      color: #111;
      text-shadow: 0 5px 6px rgba(0, 0, 0, .35), 0 1px 0 #fff
    }

    .subTitle {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .8px;
      color: #1d222b;
      text-shadow: 0 1px 0 #fff
    }

    .neonLine {
      width: 220px;
      height: 2px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #009dff, #00ffd5, #009dff, transparent);
      box-shadow: 0 0 16px rgba(0, 150, 255, .45)
    }

    .statusDock {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 34px;
      padding: 6px 13px;
      border-radius: 999px;
      background: linear-gradient(145deg, #fff, #e6eaf2);
      box-shadow: 8px 8px 18px rgba(0, 0, 0, .16), -7px -7px 18px rgba(255, 255, 255, .9), inset 2px 2px 5px rgba(255, 255, 255, .8), inset -2px -2px 5px rgba(0, 0, 0, .08);
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: .5px;
      color: #2c3139;
      transition: background .35s ease, color .25s ease, box-shadow .35s ease
    }

    .netDot {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #ff2a2a;
      box-shadow: 0 0 0 5px rgba(255, 42, 42, .12), 0 0 18px rgba(255, 0, 0, .8), inset 2px 2px 4px rgba(255, 255, 255, .5), inset -2px -2px 5px rgba(0, 0, 0, .25)
    }



    #netText {
      display: inline-block;
      white-space: nowrap;
      line-height: 1;
    }

    #netText .mqttOk {
      color: #006b2f;
      font-weight: 1000;
    }

    .statusDock.online {
      background: linear-gradient(145deg, rgba(235,255,244,.96), rgba(208,255,229,.68));
      color: #14351f;
    }

    .statusDock.online .netDot {
      background: radial-gradient(circle at 30% 25%, #f4fff8 0%, #b8ffd4 35%, #39e979 68%, #00a94f 100%);
      box-shadow: 0 0 0 5px rgba(0, 230, 118, .14), 0 0 22px rgba(0, 230, 118, .95), inset 2px 2px 4px rgba(255, 255, 255, .55), inset -2px -2px 5px rgba(0, 0, 0, .25)
    }

    .statusDock.fail {
      color: #5a0000;
    }

    .statusDock.fail .netDot {
      background: #5a0000;
      box-shadow: 0 0 0 5px rgba(80, 0, 0, .18), 0 0 18px rgba(90, 0, 0, .95), inset 2px 2px 4px rgba(255, 255, 255, .2), inset -2px -2px 5px rgba(0, 0, 0, .45)
    }

    .modeSwitchBox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      background: linear-gradient(145deg, #fff, #e7e9ee);
      box-shadow: 8px 8px 18px rgba(0, 0, 0, .18), -7px -7px 18px rgba(255, 255, 255, .9), inset 2px 2px 5px rgba(255, 255, 255, .78), inset -2px -2px 5px rgba(0, 0, 0, .09)
    }

    .modeText {
      width: 60px;
      font-size: 13px;
      line-height: 14px;
      font-weight: 900;
      text-align: center;
      color: #111
    }

    .switch {
      width: 90px;
      height: 42px;
      border: none;
      border-radius: 42px;
      position: relative;
      background: linear-gradient(145deg, #fdfdfd, #d1d6df);
      box-shadow: inset 5px 5px 10px rgba(0, 0, 0, .2), inset -5px -5px 10px rgba(255, 255, 255, .95), 0 5px 12px rgba(0, 0, 0, .22)
    }

    .knobSwitch {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff, #bfe6ff 25%, #248fff 58%, #0345a8 100%);
      box-shadow: 0 6px 10px rgba(0, 0, 0, .35), inset 3px 3px 6px rgba(255, 255, 255, .65), inset -4px -4px 7px rgba(0, 0, 0, .3);
      transition: left .62s cubic-bezier(.2,.9,.2,1)
    }

    .switch.joy .knobSwitch {
      left: 53px
    }

    .track {
      width: 200%;
      height: 100%;
      display: flex;
      transition: transform .78s cubic-bezier(.2, .9, .25, 1)
    }

    /* .controlStage {
      width: 286px;
      height: 304px;
      overflow: hidden
    } */

    .controlStage {
      position: relative
    }

    .controlStage.joystickMode .track {
      transform: translateX(-50%)
    }

    .panel {
      width: 50%;
      height: 100%;
      flex: 0 0 50%;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .controlCard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0
    }

    .sciTitle {
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #172334;
      text-align: center;
      text-shadow: 0 1px 0 #fff
    }

    .controls {
      position: relative;
      width: 276px;
      height: 276px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .96), rgba(245, 245, 245, .86) 28%, rgba(190, 190, 190, .42) 60%, rgba(60, 60, 60, .17) 100%), linear-gradient(145deg, #fdfdfd, #d7d7d7);
      box-shadow: 18px 18px 35px rgba(0, 0, 0, .32), -12px -12px 28px rgba(255, 255, 255, .95), inset 8px 8px 18px rgba(255, 255, 255, .82), inset -12px -12px 25px rgba(0, 0, 0, .15)
    }

    .controls::before {
      content: "";
      position: absolute;
      width: 216px;
      height: 216px;
      left: 30px;
      top: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 230, 230, .45), rgba(120, 120, 120, .16) 60%, rgba(0, 0, 0, .12)), linear-gradient(145deg, #eee, #fff);
      box-shadow: inset 10px 10px 22px rgba(0, 0, 0, .13), inset -10px -10px 22px rgba(255, 255, 255, .95)
    }

    .btn {
      position: absolute;
      width: 64px;
      height: 64px;
      border: none;
      outline: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .98) 0 12%, rgba(174, 225, 255, .98) 22%, rgba(38, 143, 255, .98) 48%, rgba(6, 75, 189, .98) 77%, rgba(2, 28, 86, .98) 100%);
      box-shadow: inset 8px 8px 15px rgba(255, 255, 255, .58), inset -10px -12px 18px rgba(0, 0, 0, .43), 0 18px 18px rgba(0, 0, 0, .3), 0 0 24px rgba(0, 120, 255, .28);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4;
      overflow: hidden;
      cursor: pointer;
      transition: transform .1s ease, box-shadow .1s ease, filter .1s ease
    }

    .btn:active,
    .btn.active,
    .btn.latched {
      transform: translateY(7px) scale(.94);
      filter: saturate(1.18);
      box-shadow: inset 7px 8px 15px rgba(0, 0, 0, .46), inset -5px -5px 12px rgba(255, 255, 255, .36), 0 7px 8px rgba(0, 0, 0, .24), 0 0 28px rgba(0, 130, 255, .65)
    }

    .btn.latched {
      outline: 4px solid rgba(0, 255, 140, .45)
    }

    .stop {
      width: 86px;
      height: 86px;
      left: 95px;
      top: 95px;
      background: radial-gradient(circle at 30% 20%, #fff 0 8%, #ffb4b4 18%, #ff3030 48%, #b40000 76%, #530000 100%);
      color: white;
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: 1.5px;
      text-shadow: 0 3px 5px rgba(0, 0, 0, .75);
      box-shadow: inset 8px 8px 14px rgba(255, 255, 255, .44), inset -12px -14px 20px rgba(0, 0, 0, .5), 0 20px 20px rgba(0, 0, 0, .32), 0 0 24px rgba(255, 0, 0, .25)
    }

    .forward {
      left: 106px;
      top: 13px
    }

    .back {
      left: 106px;
      bottom: 13px
    }

    .left {
      left: 13px;
      top: 106px
    }

    .right {
      right: 13px;
      top: 106px
    }

    .fl {
      left: 42px;
      top: 42px
    }

    .fr {
      right: 42px;
      top: 42px
    }

    .bl {
      left: 42px;
      bottom: 42px
    }

    .br {
      right: 42px;
      bottom: 42px
    }

    .corner {
      width: 42px;
      height: 42px;
      font-size: 12px;
      font-weight: 900;
      color: white
    }

    .arrow {
      width: 0;
      height: 0;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .25));
      z-index: 2
    }

    .up {
      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-bottom: 29px solid #fff
    }

    .down {
      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-top: 29px solid #fff
    }

    .leftA {
      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
      border-right: 29px solid #fff
    }

    .rightA {
      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
      border-left: 29px solid #fff
    }

    .joyWrap {
      width: 276px;
      height: 276px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .95), rgba(245, 245, 245, .85) 28%, rgba(190, 190, 190, .45) 60%, rgba(60, 60, 60, .18) 100%), linear-gradient(145deg, #fdfdfd, #d7d7d7);
      box-shadow: 18px 18px 35px rgba(0, 0, 0, .35), -12px -12px 28px rgba(255, 255, 255, .95), inset 8px 8px 18px rgba(255, 255, 255, .8), inset -12px -12px 25px rgba(0, 0, 0, .16);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: none
    }

    .joyWrap::before {
      content: "";
      position: absolute;
      width: 228px;
      height: 228px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 230, 230, .5), rgba(120, 120, 120, .18) 60%, rgba(0, 0, 0, .13)), linear-gradient(145deg, #eee, #fff);
      box-shadow: inset 10px 10px 22px rgba(0, 0, 0, .13), inset -10px -10px 22px rgba(255, 255, 255, .95)
    }

    .joyBase {
      width: 202px;
      height: 202px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at center, rgba(0, 120, 255, .07), transparent 38%), radial-gradient(circle at center, transparent 0 60%, rgba(0, 0, 0, .12) 61%, transparent 64%);
      z-index: 2
    }

    .joyBase::before,
    .joyBase::after {
      content: "";
      position: absolute;
      background: rgba(0, 0, 0, .13);
      border-radius: 20px
    }

    .joyBase::before {
      width: 150px;
      height: 5px;
      left: 32px;
      top: 104px
    }

    .joyBase::after {
      width: 5px;
      height: 150px;
      left: 104px;
      top: 32px
    }

    .knob {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      position: absolute;
      left: 53px;
      top: 53px;
      background: radial-gradient(circle at 30% 22%, #fff, #bfe6ff 20%, #268fff 48%, #064bbd 78%, #021c56 100%);
      box-shadow: 0 22px 22px rgba(0, 0, 0, .35), inset 8px 8px 14px rgba(255, 255, 255, .55), inset -10px -12px 18px rgba(0, 0, 0, .42), 0 0 24px rgba(0, 120, 255, .4);
      z-index: 5
    }

    .knob::before {
      content: "";
      position: absolute;
      width: 52px;
      height: 26px;
      border-radius: 50%;
      left: 20px;
      top: 14px;
      background: rgba(255, 255, 255, .45);
      filter: blur(1px);
      transform: rotate(-20deg)
    }

    .knob.active {
      box-shadow: 0 26px 28px rgba(0, 0, 0, .42), inset 8px 8px 14px rgba(255, 255, 255, .55), inset -10px -12px 18px rgba(0, 0, 0, .42), 0 0 35px rgba(0, 130, 255, .8)
    }

    .arcText {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 104%;
      z-index: 3;
      pointer-events: none;
      overflow: visible
    }

    .arcText text {
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: 2.2px;
      fill: #172334;
      text-shadow: 0 1px 0 #fff, 0 3px 5px rgba(0, 0, 0, .28)
    }

    .trimArea {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 20
    }



    .topControlRow {
      width: min(100%, 318px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 20
    }

    .topControlRow .trimArea {
      width: auto;
      flex: 0 0 auto
    }

    .topControlRow .trimBox {
      width: 124px;
      height: 32px;
      padding: 6px 10px
    }

    .topControlRow #trimSlider {
      width: 100px
    }

    .topControlRow .modeSwitchBox {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 184px;
      height: 34px;
      padding: 4px;
      gap: 0;
      flex: 0 0 auto;
      overflow: hidden;
      touch-action: pan-y;
      cursor: pointer
    }

    .topControlRow .modeText {
      position: relative;
      z-index: 3;
      width: 88px;
      font-size: 11px;
      line-height: 12px;
      color: #18202c;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px rgba(0, 0, 0, .22);
      transition: color .22s ease, text-shadow .22s ease
    }

    .topControlRow .switch {
      position: absolute;
      z-index: 2;
      left: 4px;
      top: 4px;
      width: 88px;
      height: 26px;
      border-radius: 999px;
      pointer-events: none;
      background: radial-gradient(circle at 28% 18%, #f7fbff 0 10%, #d8ecff 28%, #3198ff 65%, #064eb8 100%);
      box-shadow: 0 5px 10px rgba(0, 0, 0, .28), inset 4px 4px 8px rgba(255, 255, 255, .55), inset -5px -5px 10px rgba(0, 0, 0, .28);
      transition: left .72s cubic-bezier(.2, .9, .25, 1)
    }

    .topControlRow .switch.joy {
      left: 92px
    }

    .topControlRow .knobSwitch {
      display: none
    }

    .topControlRow .modeSwitchBox:not(.joyMode) .modeText:first-child,
    .topControlRow .modeSwitchBox.joyMode .modeText:last-child {
      color: #fff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 2px 5px rgba(0, 0, 0, .75), 0 0 6px rgba(0, 0, 0, .45)
    }


    .cornerToolBtn {
      position: absolute;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 15px;
      background: radial-gradient(circle at 30% 18%, #fff 0 14%, #eef6ff 28%, #d7e5f8 58%, #b7c6dc 100%);
      box-shadow: 6px 6px 13px rgba(0, 0, 0, .2), -5px -5px 13px rgba(255, 255, 255, .95), inset 3px 3px 6px rgba(255, 255, 255, .82), inset -4px -5px 8px rgba(0, 0, 0, .13);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 8;
      cursor: pointer;
      touch-action: none;
      transition: transform .1s ease, box-shadow .12s ease, background .12s ease, filter .12s ease
    }

    .cornerToolBtn.leftTool {
      left: -34px;
      top: -30px
    }

    .cornerToolBtn.rightTool {
      right: -34px;
      top: -30px
    }

    .cornerToolBtn:active,
    .cornerToolBtn.active,
    .cornerToolBtn.blinkRun {
      transform: translateY(5px) scale(.92);
      background: radial-gradient(circle at 32% 20%, #fff 0 10%, #8ed5ff 25%, #0077ff 62%, #003d99 100%);
      filter: saturate(1.18);
      box-shadow: inset 6px 7px 12px rgba(0, 0, 0, .42), inset -4px -4px 9px rgba(255, 255, 255, .36), 0 3px 6px rgba(0, 0, 0, .22), 0 0 18px rgba(0, 120, 255, .55)
    }

    .cornerToolBtn.blinkRun {
      animation: cornerPulseBlink 330ms linear infinite
    }

    @keyframes cornerPulseBlink {
      0%, 49% {
        transform: translateY(5px) scale(.92);
        background: radial-gradient(circle at 32% 20%, #fff 0 10%, #8ed5ff 25%, #0077ff 62%, #003d99 100%);
        filter: saturate(1.22);
        box-shadow: inset 6px 7px 12px rgba(0, 0, 0, .42), inset -4px -4px 9px rgba(255, 255, 255, .36), 0 3px 6px rgba(0, 0, 0, .22), 0 0 22px rgba(0, 120, 255, .75)
      }
      50%, 100% {
        transform: translateY(0) scale(1);
        background: radial-gradient(circle at 30% 18%, #fff 0 14%, #eef6ff 28%, #d7e5f8 58%, #b7c6dc 100%);
        filter: saturate(1);
        box-shadow: 6px 6px 13px rgba(0, 0, 0, .2), -5px -5px 13px rgba(255, 255, 255, .95), inset 3px 3px 6px rgba(255, 255, 255, .82), inset -4px -5px 8px rgba(0, 0, 0, .13)
      }
    }


    /* Pulse buttons: blink only, no jumping/up-down movement */
    .cornerToolBtn.blinkRun {
      transform: none !important;
      animation: cornerSoftBlink 360ms linear infinite;
    }

    @keyframes cornerSoftBlink {
      0%, 49% {
        background: radial-gradient(circle at 32% 20%, #fff 0 10%, #8ed5ff 25%, #0077ff 62%, #003d99 100%);
        filter: saturate(1.22);
        box-shadow: 6px 6px 13px rgba(0, 0, 0, .2), -5px -5px 13px rgba(255, 255, 255, .95), inset 3px 3px 6px rgba(255, 255, 255, .82), inset -4px -5px 8px rgba(0, 0, 0, .13), 0 0 22px rgba(0, 120, 255, .75);
      }
      50%, 100% {
        background: radial-gradient(circle at 30% 18%, #fff 0 14%, #eef6ff 28%, #d7e5f8 58%, #b7c6dc 100%);
        filter: saturate(1);
        box-shadow: 6px 6px 13px rgba(0, 0, 0, .2), -5px -5px 13px rgba(255, 255, 255, .95), inset 3px 3px 6px rgba(255, 255, 255, .82), inset -4px -5px 8px rgba(0, 0, 0, .13);
      }
    }

    .cornerToolBtn .toolIcon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto
    }

    .cornerToolBtn:active .toolIcon,
    .cornerToolBtn.active .toolIcon,
    .cornerToolBtn.blinkRun .toolIcon {
      color: #fff;
      stroke: #fff;
      fill: currentColor;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35))
    }



    .pulseToolLayer {
      position: absolute;
      top: 0;
      left: 50%;
      width: 310px;
      height: 0;
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none
    }

    .pulseToolLayer .cornerToolBtn {
      pointer-events: auto;
      top: 35px
    }

    .pulseToolLayer .cornerToolBtn.leftTool {
      left: -28px
    }

    .pulseToolLayer .cornerToolBtn.rightTool {
      right: -28px
    }

    .controls > .cornerToolBtn,
    .joyWrap > .cornerToolBtn {
      display: none !important
    }

    .cornerToolBtn .cornerLabel {
      position: relative;
      z-index: 2;
      margin-top: 1px;
      font-size: 7.5px;
      line-height: 7.5px;
      font-weight: 1000;
      letter-spacing: .15px;
      color: #111;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .95), 0 2px 3px rgba(0, 0, 0, .28);
      white-space: normal
    }

    .cornerToolBtn.blinkRun .cornerLabel,
    .cornerToolBtn:active .cornerLabel,
    .cornerToolBtn.active .cornerLabel {
      color: #fff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 2px 4px rgba(0, 0, 0, .75)
    }

    .bottomDock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 100%
    }

    .speedBox {
      width: 304px;
      min-height: 96px;
      padding: 12px 14px 0;
      border-radius: 34px;
      background: linear-gradient(145deg, #fff, #eee);
      box-shadow: 10px 10px 22px rgba(0, 0, 0, .25), -8px -8px 20px rgba(255, 255, 255, .98), inset 3px 3px 8px rgba(255, 255, 255, .85), inset -4px -4px 10px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .speedBox label {
      font-size: 20px;
      font-weight: 1000;
      margin-bottom: 9px;
      padding: 5px 18px;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff, #e5e5e5);
      box-shadow: 5px 5px 10px rgba(0, 0, 0, .18), -5px -5px 10px rgba(255, 255, 255, .95);
      color: #111;
      text-shadow: 0 1px 0 #fff, 0 3px 5px rgba(0, 0, 0, .32), 0 8px 13px rgba(0, 0, 0, .18)
    }

    .speedRow {
      display: flex;
      align-items: center;
      gap: 13px
    }

    input[type=range] {
      width: 198px;

                  <path d="M38 14c5 3 8 7 8 10s-3 7-8 10" class="soundLine" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" />
                </svg><span class="cornerLabel">Pulse<br>Horn</span></button>
              <button class="cornerToolBtn rightTool blinkLightBtn" aria-label="Blink Headlight"><svg class="toolIcon lightIcon" viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M10 12C25 12 37 21 37 32S25 52 10 52" fill="none" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M10 12V52" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
                  <line class="beam" x1="45" y1="16" x2="58" y2="16" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                  <line class="beam" x1="43" y1="26" x2="58" y2="26" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                  <line class="beam" x1="43" y1="38" x2="58" y2="38" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                  <line class="beam" x1="45" y1="48" x2="58" y2="48" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                </svg><span class="cornerLabel">Pulse<br>Light</span></button>
              <button class="btn corner fl" data-cmd="FL">FL</button><button class="btn forward latchBtn"
                data-cmd="F"><span class="arrow up"></span></button><button class="btn corner fr"
                data-cmd="FR">FR</button>
              <button class="btn left" data-cmd="L"><span class="arrow leftA"></span></button><button class="btn stop"
                data-cmd="S">STOP</button><button class="btn right" data-cmd="R"><span
                  class="arrow rightA"></span></button>
              <button class="btn corner bl" data-cmd="BL">BL</button><button class="btn back latchBtn"
                data-cmd="B"><span class="arrow down"></span></button><button class="btn corner br"
                data-cmd="BR">BR</button>
            </div>
          </div>
        </div>
        <div class="panel joyPanel">
          <div class="controlCard">
            <div class="joyWrap"><button class="cornerToolBtn leftTool pulseHornBtn" aria-label="Pulse Horn"><svg class="toolIcon hornIcon" viewBox="0 0 48 48" aria-hidden="true">
                  <path d="M8 28h8l12 8V12L16 20H8z" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linejoin="round" />
                  <path d="M8 20v8" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                  <path d="M32 18c3 2 5 4 5 6s-2 4-5 6" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" />
                  <path d="M38 14c5 3 8 7 8 10s-3 7-8 10" class="soundLine" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" />
                </svg><span class="cornerLabel">Pulse<br>Horn</span></button>
              <button class="cornerToolBtn rightTool blinkLightBtn" aria-label="Blink Headlight"><svg class="toolIcon lightIcon" viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M10 12C25 12 37 21 37 32S25 52 10 52" fill="none" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M10 12V52" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
                  <line class="beam" x1="45" y1="16" x2="58" y2="16" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                  <line class="beam" x1="43" y1="26" x2="58" y2="26" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                  <line class="beam" x1="43" y1="38" x2="58" y2="38" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                  <line class="beam" x1="45" y1="48" x2="58" y2="48" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" />
                </svg><span class="cornerLabel">Pulse<br>Light</span></button><svg class="arcText" viewBox="0 0 292 292">
                <defs>
                  <path id="smoothArc" d="M 55 105 A 96 96 0 0 1 237 105" />
                </defs><text>
                  <textPath href="#smoothArc" startOffset="50%" text-anchor="middle">360 SMOOTH DRIVE</textPath>
                </text>
              </svg>
              <div class="joyBase" id="joyBase">
                <div class="knob" id="knob"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottomDock">
      <div class="speedBox"><label>Speed</label>
        <div class="speedRow"><input id="speedSlider" type="range" min="0" max="255" value="140"><span
            id="speedVal">55%</span></div>
      </div>

    </div>
    <div class="footerText">© 2025 ESP32-6WD V7 | Designed by Aman Sharma</div>
  </div>
  <script>
    const mqttTopic = 'esp32_6wd_aman_v7/control';
    const statusDock = document.getElementById('statusDock'), netText = document.getElementById('netText'), controlStage = document.getElementById('controlStage'), modeSwitch = document.getElementById('modeSwitch'), joyBase = document.getElementById('joyBase'), knob = document.getElementById('knob'), speedSlider = document.getElementById('speedSlider'), trimSlider = document.getElementById('trimSlider'), hornButton = document.getElementById('hornButton'), lightButton = document.getElementById('lightButton');
    let mode = 'buttons', joyActive = false, lastJoy = 0, maxMove = 62, latchedCmd = '', momentaryCmd = '', heartbeatTimer = null, joyX = 0, joyY = 0, hornActive = false, lightOn = false, pulseHornOn = false, blinkLightOn = false;
    const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: 'aman_v7_cloud_ui_' + Math.random().toString(16).slice(2, 10), clean: true, connectTimeout: 6000, reconnectPeriod: 2000 });
    mqttClient.on('connect', () => { setStatus('online', 'Internet Connected • MQTT Broker Connected'); publish('S'); publish('SPD,' + speedSlider.value); publish('TRIM,' + trimSlider.value); publish(lightOn ? 'LIGHT1' : 'LIGHT0'); startHeartbeat(); });
    mqttClient.on('reconnect', () => setStatus('connecting', 'Connecting cloud link...'));
    mqttClient.on('offline', () => setStatus('fail', 'Offline • link lost'));
    mqttClient.on('error', () => setStatus('fail', 'Connection failed'));
    function setStatus(type, text) { statusDock.classList.remove('online', 'fail'); if (type === 'online') statusDock.classList.add('online'); if (type === 'fail') statusDock.classList.add('fail'); if (type === 'online') {
        netText.innerHTML = 'Internet Connected • <span class="mqttOk">MQTT Broker Connected</span>';
      } else {
        netText.textContent = text;
      } }
    function publish(msg) { if (mqttClient.connected) { mqttClient.publish(mqttTopic, msg, { qos: 0, retain: false }); console.log('MQTT:', msg); } }
    function activeCommand() { if (joyActive) return 'J,' + Math.round(joyX) + ',' + Math.round(joyY); if (momentaryCmd) return momentaryCmd; if (latchedCmd) return latchedCmd; return '' }
    function startHeartbeat() { if (heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer = setInterval(() => { if (hornActive && !pulseHornOn) publish('H1'); const cmd = activeCommand(); if (cmd) publish(cmd); }, 300) }
    function clearLatch() { latchedCmd = ''; document.querySelectorAll('.latchBtn').forEach(b => b.classList.remove('latched')) }
    function stopAll() { momentaryCmd = ''; clearLatch(); releaseJoy(false); hornActive = false; pulseHornOn = false; blinkLightOn = false; lightOn = false; hornButton.classList.remove('active'); lightButton.classList.remove('lightOn'); updatePulseButtons(); publish('H0'); publish('HPULSE0'); publish('LBLINK0'); publish('LIGHT0'); publish('S') }
    function setMode(newMode) { if (mode === newMode) return; stopAll(); mode = newMode; controlStage.classList.toggle('joystickMode', mode === 'joystick'); modeSwitch.classList.toggle('joy', mode === 'joystick'); modeSwitch.closest('.modeSwitchBox').classList.toggle('joyMode', mode === 'joystick') }
    function toggleMode() { setMode(mode === 'buttons' ? 'joystick' : 'buttons') }
    function bindModeSwitch() {
      const box = modeSwitch.closest('.modeSwitchBox');
      let startX = 0, dragging = false;
      function modeFromPoint(x) {
        const rect = box.getBoundingClientRect();
        return x < rect.left + rect.width / 2 ? 'buttons' : 'joystick';
      }
      box.addEventListener('pointerdown', e => {
        e.preventDefault();
        startX = e.clientX;
        dragging = true;
        box.setPointerCapture(e.pointerId);
      });
      box.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        if (mode === 'buttons' && dx > 18) setMode('joystick');
        if (mode === 'joystick' && dx < -18) setMode('buttons');
      });
      function finish(e) {
        if (!dragging) return;
        dragging = false;
        const dx = e.clientX - startX;
        if (Math.abs(dx) < 10) setMode(modeFromPoint(e.clientX));
      }
      box.addEventListener('pointerup', finish);
      box.addEventListener('pointercancel', () => { dragging = false });
      box.addEventListener('lostpointercapture', () => { dragging = false });
      box.classList.toggle('joyMode', mode === 'joystick');
    }
    function bindButtons() { document.querySelectorAll('.btn').forEach(btn => { const cmd = btn.dataset.cmd; btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); if (cmd === 'S') { stopAll(); btn.classList.add('active'); return } if (cmd === 'F' || cmd === 'B') { momentaryCmd = ''; if (latchedCmd === cmd) { clearLatch(); publish('S') } else { clearLatch(); latchedCmd = cmd; btn.classList.add('latched'); publish(cmd) } return } clearLatch(); momentaryCmd = cmd; btn.classList.add('active'); publish(cmd) }); const up = () => { btn.classList.remove('active'); if (cmd !== 'F' && cmd !== 'B' && cmd !== 'S') { momentaryCmd = ''; publish(latchedCmd || 'S') } if (cmd === 'S') btn.classList.remove('active') }; btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up) }) }
    function updateMaxMove() { maxMove = Math.min(joyBase.clientWidth, joyBase.clientHeight) * 0.27 }
    function sendJoy(x, y, force = false) { joyX = x; joyY = y; const now = Date.now(); if (!force && now - lastJoy < 45) return; lastJoy = now; publish('J,' + Math.round(x) + ',' + Math.round(y)) }
    function moveKnob(clientX, clientY) { updateMaxMove(); clearLatch(); momentaryCmd = ''; const rect = joyBase.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2; let dx = clientX - cx, dy = clientY - cy; const dist = Math.sqrt(dx * dx + dy * dy); if (dist > maxMove) { dx = dx / dist * maxMove; dy = dy / dist * maxMove } knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; knob.classList.add('active'); sendJoy((dx / maxMove) * 100, (-dy / maxMove) * 100) }
    joyBase.addEventListener('pointerdown', e => { e.preventDefault(); joyActive = true; joyBase.setPointerCapture(e.pointerId); moveKnob(e.clientX, e.clientY) });
    joyBase.addEventListener('pointermove', e => { if (joyActive) moveKnob(e.clientX, e.clientY) });
    function releaseJoy(send = true) { joyActive = false; joyX = 0; joyY = 0; knob.style.transform = 'translate(0,0)'; knob.classList.remove('active'); if (send) publish('J,0,0') }
    joyBase.addEventListener('pointerup', () => releaseJoy(true)); joyBase.addEventListener('pointercancel', () => releaseJoy(true)); joyBase.addEventListener('lostpointercapture', () => releaseJoy(true));
    function getSpeedColor(percent) { let hue = 210 - (percent * 2.1); return 'hsl(' + hue + ',100%,45%)' }
    function setSpeed(v) { const p = Math.round((v / 255) * 100), color = getSpeedColor(p); document.getElementById('speedVal').textContent = p + '%'; speedSlider.style.background = 'linear-gradient(90deg,' + color + ' 0%,' + color + ' ' + p + '%,#e5e5e5 ' + p + '%,#e5e5e5 100%)'; publish('SPD,' + v) }
    function setTrim(v) { const val = Number(v), p = ((val + 25) / 50) * 100; trimSlider.style.background = val >= 0 ? 'linear-gradient(90deg,#ddd 0%,#ddd 50%,#111 50%,#111 ' + p + '%,#ddd ' + p + '%,#ddd 100%)' : 'linear-gradient(90deg,#ddd 0%,#ddd ' + p + '%,#111 ' + p + '%,#111 50%,#ddd 50%,#ddd 100%)'; publish('TRIM,' + val) }
    speedSlider.addEventListener('input', e => setSpeed(e.target.value)); trimSlider.addEventListener('input', e => setTrim(e.target.value)); window.addEventListener('resize', updateMaxMove); document.addEventListener('contextmenu', e => e.preventDefault()); window.addEventListener('beforeunload', () => { publish('S'); publish('H0'); publish('HPULSE0'); publish('LBLINK0'); publish('LIGHT0'); });

    function startHornPress(e) {
      e.preventDefault();
      hornButton.setPointerCapture(e.pointerId);
      hornActive = true;
      hornButton.classList.add('active');
      if (!pulseHornOn) publish('H1');
    }
    function endHornPress() {
      hornActive = false;
      hornButton.classList.remove('active');
      if (!pulseHornOn) publish('H0');
    }
    hornButton.addEventListener('pointerdown', startHornPress);
    hornButton.addEventListener('pointerup', endHornPress);
    hornButton.addEventListener('pointercancel', endHornPress);
    hornButton.addEventListener('lostpointercapture', endHornPress);


    function updatePulseButtons() {
      document.querySelectorAll('.pulseHornBtn').forEach(btn => btn.classList.toggle('blinkRun', pulseHornOn));
      document.querySelectorAll('.blinkLightBtn').forEach(btn => btn.classList.toggle('blinkRun', blinkLightOn));
    }

    function togglePulseHorn(e) {
      e.preventDefault();
      pulseHornOn = !pulseHornOn;
      if (pulseHornOn) {
        hornActive = false;
        hornButton.classList.remove('active');
        publish('H0');
        publish('HPULSE1');
      } else {
        publish('HPULSE0');
      }
      updatePulseButtons();
    }

    function toggleBlinkLight(e) {
      e.preventDefault();
      blinkLightOn = !blinkLightOn;
      publish(blinkLightOn ? 'LBLINK1' : 'LBLINK0');
      updatePulseButtons();
    }

    document.querySelectorAll('.pulseHornBtn').forEach(btn => btn.addEventListener('click', togglePulseHorn));
    document.querySelectorAll('.blinkLightBtn').forEach(btn => btn.addEventListener('click', toggleBlinkLight));

    function toggleLight() {
      lightOn = !lightOn;
      lightButton.classList.toggle('lightOn', lightOn);
      publish(lightOn ? 'LIGHT1' : 'LIGHT0');
    }
    lightButton.addEventListener('click', toggleLight);
    bindModeSwitch(); bindButtons(); setSpeed(speedSlider.value); setTrim(trimSlider.value); updateMaxMove(); startHeartbeat();
  </script>
