<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ESP32-6WD V7 Internet Cloud Control</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
      color: #101014;
      background: radial-gradient(circle at 50% -20%, #fff 0%, #f3f6fc 45%, #dde7f5 100%);
      overflow-x: hidden;
      overscroll-behavior: contain
    }

    .app {
      width: 100%;
      min-height: 100dvh;
      padding: 22px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px
    }

    h1 {
      margin: 0;
      font-size: 36px;
      line-height: .95;
      font-weight: 1000;
      letter-spacing: -1px;
      color: #111;
      text-shadow: 0 5px 6px rgba(0, 0, 0, .35), 0 1px 0 #fff
    }

    .subTitle {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .8px;
      color: #1d222b;
      text-shadow: 0 1px 0 #fff
    }

    .neonLine {
      width: 220px;
      height: 2px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #009dff, #00ffd5, #009dff, transparent);
      box-shadow: 0 0 16px rgba(0, 150, 255, .45)
    }

    .statusDock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 42px;
      padding: 8px 15px;
      border-radius: 999px;
      background: linear-gradient(145deg, #fff, #e6eaf2);
      box-shadow: 8px 8px 18px rgba(0, 0, 0, .16), -7px -7px 18px rgba(255, 255, 255, .9), inset 2px 2px 5px rgba(255, 255, 255, .8), inset -2px -2px 5px rgba(0, 0, 0, .08);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .5px;
      color: #2c3139
    }

    .netDot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff2a2a;
      box-shadow: 0 0 0 5px rgba(255, 42, 42, .12), 0 0 18px rgba(255, 0, 0, .8), inset 2px 2px 4px rgba(255, 255, 255, .5), inset -2px -2px 5px rgba(0, 0, 0, .25)
    }

    .statusDock.online .netDot {
      background: #00e676;
      box-shadow: 0 0 0 5px rgba(0, 230, 118, .14), 0 0 22px rgba(0, 230, 118, .95), inset 2px 2px 4px rgba(255, 255, 255, .55), inset -2px -2px 5px rgba(0, 0, 0, .25)
    }

    .statusDock.fail .netDot {
      background: #5a0000;
      box-shadow: 0 0 0 5px rgba(80, 0, 0, .18), 0 0 18px rgba(90, 0, 0, .95), inset 2px 2px 4px rgba(255, 255, 255, .2), inset -2px -2px 5px rgba(0, 0, 0, .45)
    }

    .modeSwitchBox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      background: linear-gradient(145deg, #fff, #e7e9ee);
      box-shadow: 8px 8px 18px rgba(0, 0, 0, .18), -7px -7px 18px rgba(255, 255, 255, .9), inset 2px 2px 5px rgba(255, 255, 255, .78), inset -2px -2px 5px rgba(0, 0, 0, .09)
    }

    .modeText {
      width: 60px;
      font-size: 13px;
      line-height: 14px;
      font-weight: 900;
      text-align: center;
      color: #111
    }

    .switch {
      width: 90px;
      height: 42px;
      border: none;
      border-radius: 42px;
      position: relative;
      background: linear-gradient(145deg, #fdfdfd, #d1d6df);
      box-shadow: inset 5px 5px 10px rgba(0, 0, 0, .2), inset -5px -5px 10px rgba(255, 255, 255, .95), 0 5px 12px rgba(0, 0, 0, .22)
    }

    .knobSwitch {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff, #bfe6ff 25%, #248fff 58%, #0345a8 100%);
      box-shadow: 0 6px 10px rgba(0, 0, 0, .35), inset 3px 3px 6px rgba(255, 255, 255, .65), inset -4px -4px 7px rgba(0, 0, 0, .3);
      transition: left .22s ease
    }

    .switch.joy .knobSwitch {
      left: 53px
    }

    .track {
      width: 200%;
      height: 100%;
      display: flex;
      transition: transform .5s cubic-bezier(.2, .9, .25, 1)
    }

    .controlStage.joystickMode .track {
      transform: translateX(-50%)
    }

    .panel {
      width: 50%;
      height: 100%;
      flex: 0 0 50%;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .controlCard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px
    }

    .sciTitle {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #172334;
      text-align: center;
      text-shadow: 0 1px 0 #fff
    }

    .controls {
      position: relative;
      width: 292px;
      height: 292px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .96), rgba(245, 245, 245, .86) 28%, rgba(190, 190, 190, .42) 60%, rgba(60, 60, 60, .17) 100%), linear-gradient(145deg, #fdfdfd, #d7d7d7);
      box-shadow: 18px 18px 35px rgba(0, 0, 0, .32), -12px -12px 28px rgba(255, 255, 255, .95), inset 8px 8px 18px rgba(255, 255, 255, .82), inset -12px -12px 25px rgba(0, 0, 0, .15)
    }

    .controls::before {
      content: "";
      position: absolute;
      width: 228px;
      height: 228px;
      left: 32px;
      top: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 230, 230, .45), rgba(120, 120, 120, .16) 60%, rgba(0, 0, 0, .12)), linear-gradient(145deg, #eee, #fff);
      box-shadow: inset 10px 10px 22px rgba(0, 0, 0, .13), inset -10px -10px 22px rgba(255, 255, 255, .95)
    }

    .btn {
      position: absolute;
      width: 68px;
      height: 68px;
      border: none;
      outline: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .98) 0 12%, rgba(174, 225, 255, .98) 22%, rgba(38, 143, 255, .98) 48%, rgba(6, 75, 189, .98) 77%, rgba(2, 28, 86, .98) 100%);
      box-shadow: inset 8px 8px 15px rgba(255, 255, 255, .58), inset -10px -12px 18px rgba(0, 0, 0, .43), 0 18px 18px rgba(0, 0, 0, .3), 0 0 24px rgba(0, 120, 255, .28);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4;
      overflow: hidden;
      cursor: pointer;
      transition: transform .1s ease, box-shadow .1s ease, filter .1s ease
    }

    .btn:active,
    .btn.active,
    .btn.latched {
      transform: translateY(7px) scale(.94);
      filter: saturate(1.18);
      box-shadow: inset 7px 8px 15px rgba(0, 0, 0, .46), inset -5px -5px 12px rgba(255, 255, 255, .36), 0 7px 8px rgba(0, 0, 0, .24), 0 0 28px rgba(0, 130, 255, .65)
    }

    .btn.latched {
      outline: 4px solid rgba(0, 255, 140, .45)
    }

    .stop {
      width: 92px;
      height: 92px;
      left: 100px;
      top: 100px;
      background: radial-gradient(circle at 30% 20%, #fff 0 8%, #ffb4b4 18%, #ff3030 48%, #b40000 76%, #530000 100%);
      color: white;
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: 1.5px;
      text-shadow: 0 3px 5px rgba(0, 0, 0, .75);
      box-shadow: inset 8px 8px 14px rgba(255, 255, 255, .44), inset -12px -14px 20px rgba(0, 0, 0, .5), 0 20px 20px rgba(0, 0, 0, .32), 0 0 24px rgba(255, 0, 0, .25)
    }

    .forward {
      left: 112px;
      top: 14px
    }

    .back {
      left: 112px;
      bottom: 14px
    }

    .left {
      left: 14px;
      top: 112px
    }

    .right {
      right: 14px;
      top: 112px
    }

    .fl {
      left: 46px;
      top: 46px
    }

    .fr {
      right: 46px;
      top: 46px
    }

    .bl {
      left: 46px;
      bottom: 46px
    }

    .br {
      right: 46px;
      bottom: 46px
    }

    .corner {
      width: 44px;
      height: 44px;
      font-size: 12px;
      font-weight: 900;
      color: white
    }

    .arrow {
      width: 0;
      height: 0;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .25));
      z-index: 2
    }

    .up {
      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-bottom: 29px solid #fff
    }

    .down {
      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-top: 29px solid #fff
    }

    .leftA {
      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
      border-right: 29px solid #fff
    }

    .rightA {
      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
      border-left: 29px solid #fff
    }

    .joyWrap {
      width: 292px;
      height: 292px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .95), rgba(245, 245, 245, .85) 28%, rgba(190, 190, 190, .45) 60%, rgba(60, 60, 60, .18) 100%), linear-gradient(145deg, #fdfdfd, #d7d7d7);
      box-shadow: 18px 18px 35px rgba(0, 0, 0, .35), -12px -12px 28px rgba(255, 255, 255, .95), inset 8px 8px 18px rgba(255, 255, 255, .8), inset -12px -12px 25px rgba(0, 0, 0, .16);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: none
    }

    .joyWrap::before {
      content: "";
      position: absolute;
      width: 228px;
      height: 228px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(230, 230, 230, .5), rgba(120, 120, 120, .18) 60%, rgba(0, 0, 0, .13)), linear-gradient(145deg, #eee, #fff);
      box-shadow: inset 10px 10px 22px rgba(0, 0, 0, .13), inset -10px -10px 22px rgba(255, 255, 255, .95)
    }

    .joyBase {
      width: 214px;
      height: 214px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at center, rgba(0, 120, 255, .07), transparent 38%), radial-gradient(circle at center, transparent 0 60%, rgba(0, 0, 0, .12) 61%, transparent 64%);
      z-index: 2
    }

    .joyBase::before,
    .joyBase::after {
      content: "";
      position: absolute;
      background: rgba(0, 0, 0, .13);
      border-radius: 20px
    }

    .joyBase::before {
      width: 150px;
      height: 5px;
      left: 32px;
      top: 104px
    }

    .joyBase::after {
      width: 5px;
      height: 150px;
      left: 104px;
      top: 32px
    }

    .knob {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: absolute;
      left: 59px;
      top: 59px;
      background: radial-gradient(circle at 30% 22%, #fff, #bfe6ff 20%, #268fff 48%, #064bbd 78%, #021c56 100%);
      box-shadow: 0 22px 22px rgba(0, 0, 0, .35), inset 8px 8px 14px rgba(255, 255, 255, .55), inset -10px -12px 18px rgba(0, 0, 0, .42), 0 0 24px rgba(0, 120, 255, .4);
      z-index: 5
    }

    .knob::before {
      content: "";
      position: absolute;
      width: 52px;
      height: 26px;
      border-radius: 50%;
      left: 20px;
      top: 14px;
      background: rgba(255, 255, 255, .45);
      filter: blur(1px);
      transform: rotate(-20deg)
    }

    .knob.active {
      box-shadow: 0 26px 28px rgba(0, 0, 0, .42), inset 8px 8px 14px rgba(255, 255, 255, .55), inset -10px -12px 18px rgba(0, 0, 0, .42), 0 0 35px rgba(0, 130, 255, .8)
    }

    .arcText {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 104%;
      z-index: 3;
      pointer-events: none;
      overflow: visible
    }

    .arcText text {
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: 2.2px;
      fill: #172334;
      text-shadow: 0 1px 0 #fff, 0 3px 5px rgba(0, 0, 0, .28)
    }

    .trimArea {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 20
    }

    .bottomDock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%
    }

    .speedBox {
      width: 325px;
      min-height: 112px;
      padding: 18px 18px 16px;
      border-radius: 34px;
      background: linear-gradient(145deg, #fff, #eee);
      box-shadow: 10px 10px 22px rgba(0, 0, 0, .25), -8px -8px 20px rgba(255, 255, 255, .98), inset 3px 3px 8px rgba(255, 255, 255, .85), inset -4px -4px 10px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .speedBox label {
      font-size: 26px;
      font-weight: 1000;
      margin-bottom: 14px;
      padding: 5px 18px;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff, #e5e5e5);
      box-shadow: 5px 5px 10px rgba(0, 0, 0, .18), -5px -5px 10px rgba(255, 255, 255, .95);
      color: #111;
      text-shadow: 0 1px 0 #fff, 0 3px 5px rgba(0, 0, 0, .32), 0 8px 13px rgba(0, 0, 0, .18)
    }

    .speedRow {
      display: flex;
      align-items: center;
      gap: 13px
    }

    input[type=range] {
      width: 215px;
      height: 10px;
      appearance: none;
      border-radius: 20px;
      background: #e5e5e5;
      box-shadow: inset 3px 3px 7px rgba(0, 0, 0, .2), inset -3px -3px 7px rgba(255, 255, 255, .95)
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff, #8ed5ff 35%, #0077ff 75%, #003d99);
      box-shadow: 0 8px 16px rgba(0, 0, 0, .28), inset 4px 4px 8px rgba(255, 255, 255, .55), inset -4px -4px 8px rgba(0, 0, 0, .25)
    }

    #speedVal {
      font-size: 20px;
      font-weight: 1000;
      width: 48px;
      text-align: left;
      color: #111;
      text-shadow: 0 1px 0 #fff, 0 2px 4px rgba(0, 0, 0, .42)
    }

    .trimBox {
      width: 185px;
      height: 32px;
      padding: 6px 12px;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff, #eee);
      box-shadow: 5px 5px 12px rgba(0, 0, 0, .18), -5px -5px 12px rgba(255, 255, 255, .95), inset 2px 2px 5px rgba(255, 255, 255, .85), inset -2px -2px 5px rgba(0, 0, 0, .08);
      display: flex;
      align-items: center;
      justify-content: center
    }

    #trimSlider {
      width: 155px;
      height: 6px;
      appearance: none;
      border-radius: 20px;
      background: #ddd;
      box-shadow: inset 2px 2px 5px rgba(0, 0, 0, .2), inset -2px -2px 5px rgba(255, 255, 255, .95)
    }

    #trimSlider::-webkit-slider-thumb {
      appearance: none;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff, #d9d9d9 35%, #444 78%, #111);
      box-shadow: 0 5px 9px rgba(0, 0, 0, .35), inset 3px 3px 6px rgba(255, 255, 255, .55), inset -3px -3px 6px rgba(0, 0, 0, .35)
    }

    .hornButton {
      width: 96px;
      height: 96px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #fff 0 9%, #ffe7a6 20%, #ffb000 48%, #d16b00 76%, #5c2300 100%);
      box-shadow: inset 8px 8px 14px rgba(255, 255, 255, .52), inset -12px -14px 20px rgba(0, 0, 0, .45), 0 18px 20px rgba(0, 0, 0, .28), 0 0 24px rgba(255, 170, 0, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      cursor: pointer;
      transition: transform .1s ease, filter .1s ease, box-shadow .1s ease;
      touch-action: none
    }

    .hornButton::before {
      content: "";
      position: absolute;
      width: 45px;
      height: 22px;
      border-radius: 50%;
      margin-left: -18px;
      margin-top: -38px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .72), rgba(255, 255, 255, .08));
      filter: blur(.5px);
      transform: rotate(-18deg);
      pointer-events: none
    }

    .hornButton:active,
    .hornButton.active {
      transform: translateY(7px) scale(.94);
      filter: saturate(1.25);
      box-shadow: inset 8px 8px 16px rgba(0, 0, 0, .42), inset -6px -6px 12px rgba(255, 255, 255, .32), 0 7px 9px rgba(0, 0, 0, .24), 0 0 30px rgba(255, 176, 0, .75)
    }

    .hornButton span {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .35))
    }

    .hornArea {
      display: flex;
      align-items: center;
      justify-content: center
    }

    @media (orientation:landscape) and (min-width:700px) {

      html,
      body {
        overflow: auto
      }

      .app {
        min-height: 100dvh;
        padding: 18px 34px 18px;
        display: grid;
        grid-template-columns: minmax(370px, 1fr) minmax(370px, 1fr);
        grid-template-rows: auto 1fr auto auto;
        column-gap: 34px;
        row-gap: 8px;
        align-items: center;
        justify-items: center
      }

      .header {
        grid-column: 1/-1;
        gap: 5px
      }

      .header h1 {
        font-size: clamp(38px, 5vw, 64px)
      }

      .subTitle {
        font-size: clamp(16px, 1.8vw, 24px)
      }

      .neonLine {
        width: min(360px, 40vw);
        height: 5px
      }

      .modeSwitchBox {
        display: none
      }

      .controlStage {
        display: contents;
        width: auto;
        height: auto;
        overflow: visible
      }

      .track {
        display: contents;
        width: auto;
        height: auto;
        transform: none !important
      }

      .panel {
        width: auto;
        height: auto;
        display: flex;
        flex: initial
      }

      .buttonPanel {
        grid-column: 1;
        grid-row: 2
      }

      .joyPanel {
        grid-column: 2;
        grid-row: 2
      }

      .controlCard {
        gap: 16px
      }

      .sciTitle {
        font-size: clamp(17px, 1.6vw, 26px);
        letter-spacing: 1.3px
      }

      .controls,
      .joyWrap {
        width: min(38vw, 430px);
        height: min(38vw, 430px)
      }

      .controls::before,
      .joyWrap::before {
        width: 77.8%;
        height: 77.8%;
        left: 11.1%;
        top: 11.1%
      }

      .btn {
        width: 24%;
        height: 24%
      }

      .stop {
        width: 32%;
        height: 32%;
        left: 34%;
        top: 34%;
        font-size: clamp(15px, 1.3vw, 22px)
      }

      .forward {
        left: 38%;
        top: 5%
      }

      .back {
        left: 38%;
        bottom: 5%
      }

      .left {
        left: 5%;
        top: 38%
      }

      .right {
        right: 5%;
        top: 38%
      }

      .fl {
        left: 15%;
        top: 15%
      }

      .fr {
        right: 15%;
        top: 15%
      }

      .bl {
        left: 15%;
        bottom: 15%
      }

      .br {
        right: 15%;
        bottom: 15%
      }

      .corner {
        width: 16%;
        height: 16%;
        font-size: clamp(12px, 1vw, 16px)
      }

      .joyBase {
        width: 73%;
        height: 73%
      }

      .joyBase::before {
        width: 70%;
        height: 5px;
        left: 15%;
        top: 50%
      }

      .joyBase::after {
        width: 5px;
        height: 70%;
        left: 50%;
        top: 15%
      }

      .knob {
        width: 34%;
        height: 34%;
        left: 33%;
        top: 33%
      }

      .hornArea {
        grid-column: 1/-1;
        grid-row: 3
      }

      .hornButton {
        width: 86px;
        height: 86px;
        font-size: 34px
      }

      .bottomDock {
        grid-column: 1/-1;
        grid-row: 4;
        display: grid;
        grid-template-columns: auto auto auto;
        align-items: center;
        justify-content: center;
        gap: 26px;
        width: auto
      }

      .speedBox {
        width: min(42vw, 470px);
        min-height: 106px;
        padding: 14px 24px
      }

      .speedBox label {
        font-size: clamp(25px, 2.4vw, 38px);
        margin-bottom: 10px
      }

      input[type=range] {
        width: min(28vw, 330px)
      }

      #speedVal {
        font-size: clamp(22px, 2vw, 32px);
        width: 70px
      }

      .trimArea {
        grid-column: 1/-1;
        grid-row: 2;
        align-self: start;
        margin-top: 52px;
        pointer-events: auto
      }

      .trimBox {
        width: 220px;
        height: 40px
      }

      #trimSlider {
        width: 182px
      }

      .statusDock {
        font-size: clamp(16px, 1.5vw, 24px);
        padding: 14px 22px
      }

      .netDot {
        width: 24px;
        height: 24px
      }
    }

    @media (orientation:landscape) and (min-width:700px) and (max-height:520px) {
      .app {
        padding: 8px 18px 10px;
        column-gap: 22px
      }

      .header h1 {
        font-size: 34px
      }

      .subTitle {
        font-size: 14px
      }

      .controls,
      .joyWrap {
        width: min(38vw, 330px);
        height: min(38vw, 330px)
      }

      .sciTitle {
        font-size: 14px
      }

      .hornButton {
        width: 70px;
        height: 70px;
        font-size: 28px
      }

      .bottomDock {
        gap: 16px
      }

      .speedBox {
        min-height: 82px;
        padding: 9px 16px
      }

      .speedBox label {
        font-size: 22px;
        margin-bottom: 6px
      }

      .statusDock {
        padding: 9px 16px;
        font-size: 14px
      }

      .trimArea {
        margin-top: 34px
      }

      .trimBox {
        width: 190px
      }

      .netDot {
        width: 19px;
        height: 19px
      }
    }

    /* Header side buttons + viewport-extension friendly responsive layout */
    .topBar {
      width: min(100%, 520px);
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 10px
    }

    .titleCore {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0
    }

    .toolBtn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(145deg, #fff, #e8edf5);
      box-shadow: 4px 4px 10px rgba(0, 0, 0, .14), -4px -4px 10px rgba(255, 255, 255, .9), inset 1px 1px 2px rgba(255, 255, 255, .85), inset -1px -1px 3px rgba(0, 0, 0, .08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: transform .1s ease, box-shadow .16s ease
    }

    .toolBtn:active,
    .toolBtn.active {
      transform: translateY(2px) scale(.96);
      box-shadow: inset 3px 3px 7px rgba(0, 0, 0, .18), inset -3px -3px 7px rgba(255, 255, 255, .65), 0 2px 7px rgba(0, 0, 0, .12)
    }

    .toolIcon {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: #111;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .18s ease, fill .18s ease, filter .18s ease, opacity .18s ease
    }

    .hornIcon .soundLine {
      opacity: .9
    }

    .toolBtn.active .hornIcon {
      stroke: #006bff;
      filter: drop-shadow(0 0 5px rgba(0, 120, 255, .55))
    }

    .lightIcon .beam {
      stroke: #111;
      opacity: .65
    }

    .lightIcon .lampFill {
      fill: transparent;
      transition: fill .18s ease
    }

    .toolBtn.lightOn .lightIcon {
      stroke: #ffb300;
      filter: drop-shadow(0 0 5px rgba(255, 190, 0, .85)) drop-shadow(0 0 14px rgba(255, 210, 0, .55))
    }

    .toolBtn.lightOn .lightIcon .lampFill {
      fill: #ffd54a
    }

    .toolBtn.lightOn .lightIcon .beam {
      stroke: #ffd54a;
      opacity: 1
    }

    .hornArea {
      display: none !important
    }

    @media (max-width:390px) {
      .app {
        padding-left: 12px;
        padding-right: 12px
      }

      .topBar {
        grid-template-columns: 46px 1fr 46px;
        gap: 7px
      }

      .toolBtn {
        width: 43px;
        height: 43px;
        border-radius: 13px
      }

      .toolIcon {
        width: 26px;
        height: 26px
      }

      h1 {
        font-size: 32px
      }

      .controls,
      .joyWrap {
        width: 300px;
        height: 300px
      }

      .controlStage {
        width: 310px;
        height: 320px
      }



      .stop {
        width: 94px;
        height: 94px;
        left: 103px;
        top: 103px
      }

      .forward {
        left: 115px
      }

      .back {
        left: 115px
      }

      .left {
        top: 115px
      }

      .right {
        top: 115px
      }

      .speedBox {
        width: 304px
      }
    }

    @media (orientation:landscape) and (min-width:700px) {
      .topBar {
        width: min(100%, 720px);
        grid-template-columns: 64px 1fr 64px
      }

      .toolBtn {
        width: 56px;
        height: 56px;
        border-radius: 17px
      }

      .toolIcon {
        width: 33px;
        height: 33px
      }

      .header {
        grid-column: 1/-1;
        width: 100%
      }

      .app {
        min-height: 100dvh;
        height: auto;
        overflow: visible
      }

      .bottomDock {
        grid-template-columns: auto auto
      }

      .hornArea {
        display: none !important
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="topBar">
        <button class="toolBtn" id="hornButton" aria-label="Horn">
          <svg class="toolIcon hornIcon" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M8 28h7l13 9V11L15 20H8z"></path>
            <path class="soundLine" d="M34 18c3 3 3 9 0 12"></path>
            <path class="soundLine" d="M39 13c6 6 6 16 0 22"></path>
          </svg>
        </button>
        <div class="titleCore">
          <h1>ESP32 - 6WD</h1>
          <div class="subTitle">V7 Internet Cloud Control</div>
          <div class="neonLine"></div>
        </div>
        <button class="toolBtn" id="lightButton" aria-label="Headlight">
          <svg class="toolIcon lightIcon" viewBox="0 0 48 48" aria-hidden="true">
            <path class="lampFill" d="M11 17h16c5 0 9 4 9 9s-4 9-9 9H11z"></path>
            <path d="M11 17h16c5 0 9 4 9 9s-4 9-9 9H11z"></path>
            <path d="M11 15v22"></path>
            <path class="beam" d="M38 18h6"></path>
            <path class="beam" d="M40 26h5"></path>
            <path class="beam" d="M38 34h6"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="trimArea">
      <div class="trimBox"><input id="trimSlider" type="range" min="-25" max="25" value="0"></div>
    </div>
    <div class="controlStage" id="controlStage">
      <div class="track">
        <div class="panel buttonPanel">
          <div class="controlCard">
            <div class="sciTitle">Button Control</div>
            <div class="controls" id="buttonControls">
              <button class="btn corner fl" data-cmd="FL">FL</button><button class="btn forward latchBtn"
                data-cmd="F"><span class="arrow up"></span></button><button class="btn corner fr"
                data-cmd="FR">FR</button>
              <button class="btn left" data-cmd="L"><span class="arrow leftA"></span></button><button class="btn stop"
                data-cmd="S">STOP</button><button class="btn right" data-cmd="R"><span
                  class="arrow rightA"></span></button>
              <button class="btn corner bl" data-cmd="BL">BL</button><button class="btn back latchBtn"
                data-cmd="B"><span class="arrow down"></span></button><button class="btn corner br"
                data-cmd="BR">BR</button>
            </div>
          </div>
        </div>
        <div class="panel joyPanel">
          <div class="controlCard">
            <div class="sciTitle">Joystick Control</div>
            <div class="joyWrap"><svg class="arcText" viewBox="0 0 292 292">
                <defs>
                  <path id="smoothArc" d="M 55 105 A 96 96 0 0 1 237 105" />
                </defs><text>
                  <textPath href="#smoothArc" startOffset="50%" text-anchor="middle">360 SMOOTH DRIVE</textPath>
                </text>
              </svg>
              <div class="joyBase" id="joyBase">
                <div class="knob" id="knob"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modeSwitchBox">
      <div class="modeText">Button</div><button class="switch" id="modeSwitch" onclick="toggleMode()">
        <div class="knobSwitch"></div>
      </button>
      <div class="modeText">Joystick</div>
    </div>
    <div class="bottomDock">
      <div class="speedBox"><label>Speed</label>
        <div class="speedRow"><input id="speedSlider" type="range" min="0" max="255" value="140"><span
            id="speedVal">55%</span></div>
      </div>
      <div class="statusDock" id="statusDock"><span class="netDot"></span><span id="netText">Connecting cloud
          link...</span></div>
    </div>
  </div>
  <script>
    const mqttTopic = 'esp32_6wd_aman_v7/control';
    const statusDock = document.getElementById('statusDock'), netText = document.getElementById('netText'), controlStage = document.getElementById('controlStage'), modeSwitch = document.getElementById('modeSwitch'), joyBase = document.getElementById('joyBase'), knob = document.getElementById('knob'), speedSlider = document.getElementById('speedSlider'), trimSlider = document.getElementById('trimSlider'), hornButton = document.getElementById('hornButton'), lightButton = document.getElementById('lightButton');
    let mode = 'buttons', joyActive = false, lastJoy = 0, maxMove = 62, latchedCmd = '', momentaryCmd = '', heartbeatTimer = null, joyX = 0, joyY = 0, hornActive = false, hornHoldTimer = null, hornHeld = false, lightOn = false;
    const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: 'aman_v7_cloud_ui_' + Math.random().toString(16).slice(2, 10), clean: true, connectTimeout: 6000, reconnectPeriod: 2000 });
    mqttClient.on('connect', () => { setStatus('online', 'Online • Internet connected'); publish('S'); publish('SPD,' + speedSlider.value); publish('TRIM,' + trimSlider.value); publish(lightOn ? 'LIGHT1' : 'LIGHT0'); startHeartbeat(); });
    mqttClient.on('reconnect', () => setStatus('connecting', 'Connecting cloud link...'));
    mqttClient.on('offline', () => setStatus('fail', 'Offline • link lost'));
    mqttClient.on('error', () => setStatus('fail', 'Connection failed'));
    function setStatus(type, text) { statusDock.classList.remove('online', 'fail'); if (type === 'online') statusDock.classList.add('online'); if (type === 'fail') statusDock.classList.add('fail'); netText.textContent = text; }
    function publish(msg) { if (mqttClient.connected) { mqttClient.publish(mqttTopic, msg, { qos: 0, retain: false }); console.log('MQTT:', msg); } }
    function activeCommand() { if (joyActive) return 'J,' + Math.round(joyX) + ',' + Math.round(joyY); if (momentaryCmd) return momentaryCmd; if (latchedCmd) return latchedCmd; return '' }
    function startHeartbeat() { if (heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer = setInterval(() => { if (hornActive) publish('H1'); const cmd = activeCommand(); if (cmd) publish(cmd); }, 300) }
    function clearLatch() { latchedCmd = ''; document.querySelectorAll('.latchBtn').forEach(b => b.classList.remove('latched')) }
    function stopAll() { momentaryCmd = ''; clearLatch(); releaseJoy(false); publish('S') }
    function toggleMode() { stopAll(); mode = (mode === 'buttons') ? 'joystick' : 'buttons'; controlStage.classList.toggle('joystickMode', mode === 'joystick'); modeSwitch.classList.toggle('joy', mode === 'joystick') }
    function bindButtons() { document.querySelectorAll('.btn').forEach(btn => { const cmd = btn.dataset.cmd; btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); if (cmd === 'S') { stopAll(); btn.classList.add('active'); return } if (cmd === 'F' || cmd === 'B') { momentaryCmd = ''; if (latchedCmd === cmd) { clearLatch(); publish('S') } else { clearLatch(); latchedCmd = cmd; btn.classList.add('latched'); publish(cmd) } return } clearLatch(); momentaryCmd = cmd; btn.classList.add('active'); publish(cmd) }); const up = () => { btn.classList.remove('active'); if (cmd !== 'F' && cmd !== 'B' && cmd !== 'S') { momentaryCmd = ''; publish(latchedCmd || 'S') } if (cmd === 'S') btn.classList.remove('active') }; btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up) }) }
    function updateMaxMove() { maxMove = Math.min(joyBase.clientWidth, joyBase.clientHeight) * 0.27 }
    function sendJoy(x, y, force = false) { joyX = x; joyY = y; const now = Date.now(); if (!force && now - lastJoy < 45) return; lastJoy = now; publish('J,' + Math.round(x) + ',' + Math.round(y)) }
    function moveKnob(clientX, clientY) { updateMaxMove(); clearLatch(); momentaryCmd = ''; const rect = joyBase.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2; let dx = clientX - cx, dy = clientY - cy; const dist = Math.sqrt(dx * dx + dy * dy); if (dist > maxMove) { dx = dx / dist * maxMove; dy = dy / dist * maxMove } knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; knob.classList.add('active'); sendJoy((dx / maxMove) * 100, (-dy / maxMove) * 100) }
    joyBase.addEventListener('pointerdown', e => { e.preventDefault(); joyActive = true; joyBase.setPointerCapture(e.pointerId); moveKnob(e.clientX, e.clientY) });
    joyBase.addEventListener('pointermove', e => { if (joyActive) moveKnob(e.clientX, e.clientY) });
    function releaseJoy(send = true) { joyActive = false; joyX = 0; joyY = 0; knob.style.transform = 'translate(0,0)'; knob.classList.remove('active'); if (send) publish('J,0,0') }
    joyBase.addEventListener('pointerup', () => releaseJoy(true)); joyBase.addEventListener('pointercancel', () => releaseJoy(true)); joyBase.addEventListener('lostpointercapture', () => releaseJoy(true));
    function getSpeedColor(percent) { let hue = 210 - (percent * 2.1); return 'hsl(' + hue + ',100%,45%)' }
    function setSpeed(v) { const p = Math.round((v / 255) * 100), color = getSpeedColor(p); document.getElementById('speedVal').textContent = p + '%'; speedSlider.style.background = 'linear-gradient(90deg,' + color + ' 0%,' + color + ' ' + p + '%,#e5e5e5 ' + p + '%,#e5e5e5 100%)'; publish('SPD,' + v) }
    function setTrim(v) { const val = Number(v), p = ((val + 25) / 50) * 100; trimSlider.style.background = val >= 0 ? 'linear-gradient(90deg,#ddd 0%,#ddd 50%,#111 50%,#111 ' + p + '%,#ddd ' + p + '%,#ddd 100%)' : 'linear-gradient(90deg,#ddd 0%,#ddd ' + p + '%,#111 ' + p + '%,#111 50%,#ddd 50%,#ddd 100%)'; publish('TRIM,' + val) }
    speedSlider.addEventListener('input', e => setSpeed(e.target.value)); trimSlider.addEventListener('input', e => setTrim(e.target.value)); window.addEventListener('resize', updateMaxMove); document.addEventListener('contextmenu', e => e.preventDefault()); window.addEventListener('beforeunload', () => { publish('S'); publish('H0'); });

    function startHornPress(e) {
      e.preventDefault();
      hornButton.setPointerCapture(e.pointerId);
      hornButton.classList.add('active');
      hornHeld = false;
      if (hornHoldTimer) clearTimeout(hornHoldTimer);
      hornHoldTimer = setTimeout(() => { hornHeld = true; hornActive = true; publish('H1'); }, 260);
    }
    function endHornPress() {
      hornButton.classList.remove('active');
      if (hornHoldTimer) clearTimeout(hornHoldTimer);
      if (hornHeld) { hornActive = false; publish('H0'); }
      else { publish('H2'); }
    }
    hornButton.addEventListener('pointerdown', startHornPress);
    hornButton.addEventListener('pointerup', endHornPress);
    hornButton.addEventListener('pointercancel', endHornPress);
    hornButton.addEventListener('lostpointercapture', endHornPress);

    function toggleLight() {
      lightOn = !lightOn;
      lightButton.classList.toggle('lightOn', lightOn);
      publish(lightOn ? 'LIGHT1' : 'LIGHT0');
    }
    lightButton.addEventListener('click', toggleLight);
    bindButtons(); setSpeed(speedSlider.value); setTrim(trimSlider.value); updateMaxMove(); startHeartbeat();
  </script>
</body>

</html>
