<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ESP32-6WD</title>

<style>
*{
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
}

html, body {
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  background:#fff;
  font-family:'Poppins','Arial Black',Arial,sans-serif;
  overscroll-behavior:contain;
}

.main {
  width:100vw;
  min-height:100dvh;
  padding:30px 14px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1 {
  margin:0;
  font-size:35px;
  font-weight:900;
  color:#111;
  text-shadow:0 6px 6px rgba(0,0,0,0.5);
}

h3 {
  margin:8px 0 0;
  font-size:18px;
  font-weight:900;
  color:#222;
  letter-spacing:0.7px;
}

.joyWrap {
  margin-top:32px;
  width:315px;
  height:315px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,0.95), rgba(245,245,245,0.85) 28%, rgba(190,190,190,0.45) 60%, rgba(60,60,60,0.18) 100%),
    linear-gradient(145deg,#fdfdfd,#d7d7d7);
  box-shadow:
    18px 18px 35px rgba(0,0,0,0.35),
    -12px -12px 28px rgba(255,255,255,0.95),
    inset 8px 8px 18px rgba(255,255,255,0.8),
    inset -12px -12px 25px rgba(0,0,0,0.16);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  touch-action:none;
}

.joyWrap::before {
  content:"";
  position:absolute;
  width:245px;
  height:245px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(230,230,230,0.5), rgba(120,120,120,0.18) 60%, rgba(0,0,0,0.13)),
    linear-gradient(145deg,#eeeeee,#ffffff);
  box-shadow:
    inset 10px 10px 22px rgba(0,0,0,0.13),
    inset -10px -10px 22px rgba(255,255,255,0.95);
}

.joyBase {
  width:230px;
  height:230px;
  border-radius:50%;
  position:relative;
  background:
    radial-gradient(circle at center, rgba(0,120,255,0.07), transparent 38%),
    radial-gradient(circle at center, transparent 0 60%, rgba(0,0,0,0.12) 61%, transparent 64%);
  z-index:2;
}

.joyBase::before,
.joyBase::after {
  content:"";
  position:absolute;
  background:rgba(0,0,0,0.13);
  border-radius:20px;
}

.joyBase::before {
  width:160px;
  height:5px;
  left:35px;
  top:112px;
}

.joyBase::after {
  width:5px;
  height:160px;
  left:112px;
  top:35px;
}

.knob {
  width:105px;
  height:105px;
  border-radius:50%;
  position:absolute;
  left:62.5px;
  top:62.5px;
  background:
    radial-gradient(circle at 30% 22%, #ffffff, #bfe6ff 20%, #268fff 48%, #064bbd 78%, #021c56 100%);
  box-shadow:
    0 22px 22px rgba(0,0,0,0.35),
    inset 8px 8px 14px rgba(255,255,255,0.55),
    inset -10px -12px 18px rgba(0,0,0,0.42),
    0 0 24px rgba(0,120,255,0.4);
  z-index:5;
  transition:box-shadow 0.12s;
}

.knob::before {
  content:"";
  position:absolute;
  width:52px;
  height:26px;
  border-radius:50%;
  left:20px;
  top:14px;
  background:rgba(255,255,255,0.45);
  filter:blur(1px);
  transform:rotate(-20deg);
}

.knob.active {
  box-shadow:
    0 26px 28px rgba(0,0,0,0.42),
    inset 8px 8px 14px rgba(255,255,255,0.55),
    inset -10px -12px 18px rgba(0,0,0,0.42),
    0 0 35px rgba(0,130,255,0.8);
}

.joyText {
  position:absolute;
  bottom:16px;
  width:210px;
  height:58px;
  z-index:6;
  pointer-events:none;
}

.joyText svg {
  width:100%;
  height:100%;
  overflow:visible;
}

.joyText text {
  font-size:9px;
  font-weight:600;
  letter-spacing:1.5px;
  fill:#111;
  opacity:0.78;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.9),
    0 3px 2px rgba(0,0,0,0.35);
}

.speedBox {
  margin-top:28px;
  width:325px;
  min-height:112px;
  padding:18px 18px 16px;
  border-radius:34px;
  background:
    linear-gradient(145deg,#ffffff,#eeeeee);
  box-shadow:
    10px 10px 22px rgba(0,0,0,0.25),
    -8px -8px 20px rgba(255,255,255,0.98),
    inset 3px 3px 8px rgba(255,255,255,0.85),
    inset -4px -4px 10px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.speedBox label {
  font-size:26px;
  font-weight:900;
  margin-bottom:14px;
  padding:5px 18px;
  border-radius:22px;
  background:linear-gradient(145deg,#ffffff,#e5e5e5);
  box-shadow:
    5px 5px 10px rgba(0,0,0,0.18),
    -5px -5px 10px rgba(255,255,255,0.95);
  color:#111;
  text-shadow:
    0 1px 0 #fff,
    0 3px 5px rgba(0,0,0,0.32),
    0 8px 13px rgba(0,0,0,0.18);
}

.speedRow {
  display:flex;
  align-items:center;
  gap:13px;
}

input[type=range] {
  width:215px;
  height:10px;
  appearance:none;
  border-radius:20px;
  background:linear-gradient(90deg,#0b8cff 0%, #0b8cff 59%, #e5e5e5 59%, #e5e5e5 100%);
  box-shadow:
    inset 3px 3px 7px rgba(0,0,0,0.2),
    inset -3px -3px 7px rgba(255,255,255,0.95);
}

input[type=range]::-webkit-slider-thumb {
  appearance:none;
  width:39px;
  height:39px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#ffffff,#8ed5ff 35%,#0077ff 75%,#003d99);
  box-shadow:
    0 8px 16px rgba(0,0,0,0.28),
    inset 4px 4px 8px rgba(255,255,255,0.55),
    inset -4px -4px 8px rgba(0,0,0,0.25);
}

#speedVal {
  font-size:31px;
  font-weight:900;
  width:58px;
  text-align:left;
  color:#111;
  text-shadow:
    0 1px 0 #ffffff,
    0 3px 4px rgba(0,0,0,0.42),
    0 8px 12px rgba(0,0,0,0.22);
}

@media (orientation: landscape) {
  .main {
    min-height:100dvh;
    height:auto;
    padding:12px 22px 18px;
    display:grid;
    grid-template-columns:1fr 350px;
    grid-template-rows:auto auto 1fr;
    column-gap:22px;
    row-gap:4px;
    align-items:center;
    justify-items:center;
  }

  h1 {
    grid-column:1 / -1;
    font-size:28px;
    line-height:1;
  }

  h3 {
    grid-column:1 / -1;
    font-size:14px;
    margin:0;
  }

  .joyWrap {
    grid-column:1;
    grid-row:3;
    margin-top:0;
    transform:scale(0.82);
  }

  .speedBox {
    grid-column:2;
    grid-row:3;
    margin-top:0;
    width:325px;
  }
}

@media (orientation: landscape) and (max-height:390px) {
  h1 { font-size:24px; }
  h3 { font-size:12px; }

  .joyWrap {
    transform:scale(0.72);
  }

  .speedBox {
    transform:scale(0.92);
  }
}
</style>
</head>

<body>
<div class="main">
  <h1>ESP32-6WD</h1>
  <h3>Joystick Control</h3>

  <div id="joyWrap" class="joyWrap">
    <div id="joyBase" class="joyBase">
      <div id="knob" class="knob"></div>
    </div>

    <div class="joyText">
      <svg viewBox="0 0 210 58">
        <path id="uTextPath" d="M 20 0 Q 105 65 188 0" fill="none"/>
        <text>
          <textPath href="#uTextPath" startOffset="50%" text-anchor="middle">
            360° SMOOTH DRIVE
          </textPath>
        </text>
      </svg>
    </div>
  </div>

  <div class="speedBox">
    <label id="speedLabel">Speed</label>
    <div class="speedRow">
      <input id="speedSlider" type="range" min="0" max="255" value="150" oninput="setSpeed(this.value)">
      <div id="speedVal">59%</div>
    </div>
  </div>
</div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

const joyBase = document.getElementById('joyBase');
const knob = document.getElementById('knob');

let active = false;
let joyX = 0;
let joyY = 0;
let lastSend = 0;

const maxMove = 62;

function sendJoy(x, y, force=false) {
  const now = Date.now();
  if (!force && now - lastSend < 45) return;
  lastSend = now;

  fetch('/joy?x=' + Math.round(x) + '&y=' + Math.round(y)).catch(()=>{});
}

function moveKnob(clientX, clientY) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = clientX - cx;
  let dy = clientY - cy;

  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > maxMove) {
    dx = dx / dist * maxMove;
    dy = dy / dist * maxMove;
  }

  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  knob.classList.add('active');

  joyX = (dx / maxMove) * 100;
  joyY = (-dy / maxMove) * 100;

  sendJoy(joyX, joyY);
}

joyBase.addEventListener('pointerdown', e => {
  active = true;
  joyBase.setPointerCapture(e.pointerId);
  moveKnob(e.clientX, e.clientY);
});

joyBase.addEventListener('pointermove', e => {
  if (!active) return;
  moveKnob(e.clientX, e.clientY);
});

function releaseJoy() {
  active = false;
  joyX = 0;
  joyY = 0;
  knob.style.transform = 'translate(0px,0px)';
  knob.classList.remove('active');
  sendJoy(0, 0, true);
}

joyBase.addEventListener('pointerup', releaseJoy);
joyBase.addEventListener('pointercancel', releaseJoy);
joyBase.addEventListener('lostpointercapture', releaseJoy);

function getSpeedColor(percent) {
  let hue = 210 - (percent * 2.1);
  return "hsl(" + hue + ", 100%, 45%)";
}

function setSpeed(v) {
  let percent = Math.round((v / 255) * 100);
  let color = getSpeedColor(percent);

  document.getElementById('speedVal').innerHTML = percent + "%";

  document.getElementById('speedSlider').style.background =
    "linear-gradient(90deg, " + color + " 0%, " + color + " " + percent + "%, #e5e5e5 " + percent + "%, #e5e5e5 100%)";

  fetch('/speed?value=' + v).catch(()=>{});
}

setSpeed(150);
</script>

</body>
</html>
